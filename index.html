/* ---------- 목표·힌트: 지금 할 일(run)을 저장된 표시로만 정한다. 도중에 껐다 다시 열어도 이어서 할 일이 늘 하나 있다 ---------- */
function fGoal() {
  const f = S.f, ch = S.ch, sg = (t, run) => ({ t, npc: 'f_sage', run });
  if ((ch >= 2 && ch <= 4 && !f['pay' + ch]) || (ch === 5 && !f.ny)) return { t: `${SEASON_IC[ch]} ${SEASON[ch]}이 왔어요`, auto: true, run: fSeasonStart };
  switch (ch) {
    case 0: return sg('거북 박사와 이야기하자', fPrologue);
    case 1: return !f.bank ? { t: '광장 남쪽 조개 은행에 가 보자', npc: 'f_banker', run: fSpringBank }
      : !has('f_dep') ? { t: '사자 은행원과 이야기하자', npc: 'f_banker', run: fBankTalk }
      : { t: '토끼 촌장에게 가 보자 (빨간 지붕 집)', npc: 'f_chief', run: f.ins ? () => fSeason(2) : fSpringChief };
    case 2: return !f.buy ? { t: '연구소 서쪽 다람쥐 목공소에 가 보자', npc: 'f_boss', run: fSummerShop }
      : !f.fund ? { t: '광장 동쪽 맡김소의 곰 운용가에게 가 보자', npc: 'f_bear', run: fSummerFund }
      : !f.sumDone ? { t: '곰 운용가와 이야기하자', npc: 'f_bear', run: fSummerEnd }
      : sg('거북 박사와 여름을 정리하자', has('f_fund') ? () => fSeason(3) : fSummerTalk);
    case 3: return !f.aut1 ? { t: '태풍 뒤 목공소에 가 보자', npc: 'f_boss', run: fAutumnShop }
      : !f.roofFixed ? { t: '지붕이 날아간 촌장 집에 가 보자', npc: 'f_chief', run: fRoof }
      : !f.repair ? { t: '동쪽 부두의 펭귄 뱃사공에게 가 보자', npc: 'f_peng', run: fRepair }
      : sg('거북 박사와 가을을 정리하자', has('f_liq') ? () => fSeason(4) : fAutumnTalk);
    case 4: return !f.wbank ? { t: '조개 은행에 가 보자 (통장의 날)', npc: 'f_banker', run: fWinterBank }
      : !f.wshop ? { t: '다람쥐 목공소에 가 보자', npc: 'f_boss', run: fWinterShop }
      : !f.guard ? { t: '광장의 예금 지킴이 창구에 가 보자', npc: 'f_hen', run: fGuard }
      : sg('거북 박사와 한 해를 정리하자', !has('f_mat') ? fGuardTalk : !has('f_pen') ? fPension : !has('f_cmp') ? fYearEnd : () => fSeason(5));
    case 5: return sg('거북 박사와 새해 계획을 세우자', !has('f_rule') ? fNewYear1 : !has('f_div') ? fNewYear2 : fToExam);
    case 6: return sg('거북 박사와 시험지 연습을 하자', fExam);
    default: return { t: '본편을 마쳤어요. 수첩과 장부를 다시 읽어 보자' };
  }
}

    f_chief: f.roofFixed ? '돕기 모임 덕에 지붕을 새로 얹었단다.' : '올해도 마을 일을 잘 거들어 주게.',
    f_banker: ch < 4 ? '1년 통장과 철마다 통장의 원금과 덤은 겨울에 드려요.' : '올해도 조개 은행을 찾아 주세요.',
    f_boss: ch < 2 ? '여름에 목공소를 넓힐 거예요. 그때 들러 주세요!' : ch === 3 ? '작업장을 다시 세우는 중이에요.' : '목공소는 오늘도 바빠요!',
    f_bear: ch < 2 ? '여름이 되면 맡김소를 열어요.' : S.fin.fund ? `맡겨 둔 조개는 지금 ${fundNow()}이에요. 여러 가게에 나눠 넣어 두었어요.` : '맡김소는 여러 가게에 골고루 나눠 넣어요.',
    f_peng: f.boatFixed ? '배를 말끔히 고쳤어요!' : S.fin.paint === 2 ? '그림이 팔리면 배를 고쳐 드릴게요.' : f.boatBroken ? '배가 부서졌어요…' : '오늘은 바다가 잔잔해요.',
    f_hen: f.guard ? '예금은 돌려받았어요. 펀드는 운용 결과대로 받겠지요.' : '이웃 섬 은행 소식 들었어요? 줄이 길어요…',
    f_granny: f.guard ? '예금은 한도 안이라 다 돌려받았단다. 휴.' : '물결 은행에 맡긴 조개가 걱정이구나.',
    f_r1: rnd(['조개는 어디에 두는 게 좋을까요?', '목공소 몫 증서 값이 요즘 어떤가요?', '철마다 품삯 받는 날이 제일 좋아요!']),

  };
  await say(n.who, L[id]);
}

      { k: 'stock', ic: '📜', nm: '몫 증서', d: f.stock ? `산 값 ${FN.stock} · 오늘 값 ${FN.stockP.autumn}` : `여름에 ${FN.stockP.summer}에 팔았어요 · 오늘 값 ${FN.stockP.autumn}`, how: f.stock ? '오늘 값에 팔아요' : '갖고 있었다면 오늘 값에 팔아야 했어요', res: `${FN.stock}에 산 증서를 ${FN.stockP.autumn}에 팔았어요. 오늘 배를 고쳤어요.`, ok: !!f.stock || look },
      { k: 'paint', ic: '🖼️', nm: '조개 그림', d: `${FN.paint}쯤`, how: '사 줄 이웃을 찾아야 해요. 한 철쯤 걸려요', res: '팔려고 내놓았어요. 팔릴 때까지 배는 못 고쳐요.', ok: true }
    ];
    const render = () => {
      sh.innerHTML = `<h2>⛵ 배 수리비 ${shTxt(FN.repair)}</h2><p class="sub">👛 지갑 ${shTxt(S.shell)}${look ? ' · 지갑으로 낼 수 있어요' : ` · <b class="mk-stop">${short} 모자라요</b>`}</p>
        ${look ? '<p class="note">지갑이 모자랐다면 어디서 마련했을까요? 세 길을 견줘 봐요.</p>' : `<p class="note">모자란 ${short}을 어디서 마련할까요?</p>`}
        <div class="f-ways">${opts.map(o => `<div class="f-way${pick === o.k ? ' on' : ''}"><div class="f-acct-h">${o.ic} ${o.nm}</div><small>${o.d}</small><p>${o.how}</p>
          ${look ? '' : pick ? (pick === o.k ? '<b class="ok-t">✔</b>' : '') : `<button type="button" class="btn small" data-k="${o.k}" ${o.ok ? '' : 'disabled'}>이걸로 마련</button>`}</div>`).join('')}</div>
        ${pick ? `<p class="cmp">${opts.find(o => o.k === pick).res}</p>` : ''}
        ${look || pick ? `<div class="row"><button type="button" class="btn wide" id="fr-next">${look ? '지갑으로 내기 ▶' : '다음 ▶'}</button></div>` : ''}`;
      sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sfx('sel'); pick = b.dataset.k; render(); });
      const nx = sh.querySelector('#fr-next'); if (nx) { nx.onclick = () => {
        sfx('coin'); const m = look ? 'wallet' : pick; S.my.repair = m;
        if (m === 'dem') { f.dem -= short; S.shell += short; fLog(`언제든 통장에서 ${short} 찾음`, short); }
        if (m === 'stock') { f.stock = 0; S.my.sellStock = 'autumn'; S.shell += FN.stockP.autumn; fLog(`몫 증서를 오늘 값 ${FN.stockP.autumn}에 팖 (산 값 ${FN.stock})`, FN.stockP.autumn); }

        else { S.shell -= FN.repair; fLog('배 수리', -FN.repair); S.f.boatFixed = true; }
        updateHUD(); closeModal(); resolve();
      }; setTimeout(() => nx.focus(), 50); }
    };
    render();
  });
}

/* 비교판: 빈칸에서 시작. 칸을 누르면 ○ → × → 빈칸. 다 채우고 확인하면 틀린 칸을 알려 준다 */
const FCMP_HINT = {
  int: { dep: '1년 통장에는 겨울에 덤이 붙었지?', bond: '빌림 증서는 원금에 약속한 덤을 붙여 돌려받았지.', stock: '몫 증서에 약속한 덤이 붙은 적이 있었니? 이익이 날 때만 나눔을 받았단다.' },
  gain: { dep: '통장을 산 값보다 비싸게 팔 수 있었니?', bond: '여름 끝에 빌림 증서를 산 값보다 비싸게 사겠다는 이웃이 있었지.', stock: '몫 증서를 산 값보다 비싸게 사겠다는 이웃이 있었지.' },
  div: { dep: '통장에 이익 나눔이 들어온 적이 있었니?', bond: '빌림 증서는 장사가 잘돼도 약속한 덤만 받았지.', stock: '여름 장사가 잘됐을 때 몫 증서에 이익 나눔이 들어왔지.' },
  mat: { dep: '1년 통장은 겨울에 찾기로 정한 날이 있었지.', bond: '빌림 증서는 겨울에 갚는 날이 정해져 있었지.', stock: '몫 증서는 갚는 날이 없다고 했단다.' },
  prot: { dep: '지킴이 창구가 돌려준 것은 예금이었지.', bond: '지킴이 창구는 예금만 지켜 준단다.', stock: '지킴이 창구는 예금만 지켜 준단다.' }
};
function fCmpBoard() {
  return new Promise(resolve => {
    const v = {}, sh = openModal(false); let bad = null, tries = 0;
    const key = (q, a) => q + '_' + a, mark = x => x === 1 ? '○' : x === 0 ? '×' : '';
    const render = () => {
      const full = FCMP_Q.every(([q]) => FCMP_A.every(([a]) => v[key(q, a)] != null)), ok = bad && !bad.length;
      sh.innerHTML = `<h2>📋 금융 자산 비교판</h2><p class="sub">칸을 누를 때마다 ○ → × → 빈칸으로 바뀌어요. 장부를 떠올려 보세요.</p>
        <div class="tw"><table class="mk-tbl f-cmp f-ox"><thead><tr><th></th>${FCMP_A.map(a => `<th>${a[1]}<br><small>${a[2]}</small></th>`).join('')}</tr></thead><tbody>
        ${FCMP_Q.map(([q, t]) => `<tr><th>${t}</th>${FCMP_A.map(([a]) => { const k = key(q, a), wr = bad && bad.includes(k); return `<td><button type="button" class="f-cell${wr ? ' wrong' : ''}" data-c="${k}" aria-label="${t} · ${a}" ${ok ? 'disabled' : ''}>${mark(v[k])}</button></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
        ${bad && bad.length ? sayHTML('sage', `${bad.length}칸이 다르구나. ${(() => { const [q, a] = bad[0].split('_'); return FCMP_HINT[q][a]; })()}`) : ''}
        ${ok ? sayHTML('sage', '모두 맞았어! 이자는 예금과 채권, 시세 차익은 채권과 주식, 배당은 주식만. 만기가 없는 것은 주식, 예금자 보호를 받는 것은 예금이지.') : ''}
        <div class="row">${ok ? '<button type="button" class="btn wide" id="fx-next">다음 ▶</button>' : `<button type="button" class="btn wide" id="fx-chk" ${full ? '' : 'disabled'}>${full ? '확인' : '빈칸을 모두 채워요'}</button>`}</div>`;
      sh.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { sfx('sel'); const k = b.dataset.c; v[k] = v[k] == null ? 1 : v[k] === 1 ? 0 : null; if (bad) bad = bad.filter(x => x !== k); render(); });
      const c = sh.querySelector('#fx-chk'); if (c) c.onclick = () => {
        tries++; bad = []; FCMP_Q.forEach(([q]) => FCMP_A.forEach(([a]) => { if (v[key(q, a)] !== FACT[a][q]) bad.push(key(q, a)); }));
        sfx(bad.length ? 'no' : 'ok'); if (!bad.length && tries > 1) S.stats.qw++; render(); scrollSay(sh);
      };
      const nx = sh.querySelector('#fx-next'); if (nx) { nx.onclick = () => { sfx('sel'); closeModal(); resolve(); }; setTimeout(() => nx.focus(), 50); }
    };
    S.stats.q++;
    render();
  });
}

/* ---------- 시험지 연습 ---------- */
const ASSET_NM = { dep: '정기 예금', bond: '채권', stock: '주식' }, CIRC = ['㉠', '㉡', '㉢'];
const RANK = { ret: { dep: 1, bond: 2, stock: 3 }, safe: { dep: 3, bond: 2, stock: 1 } };
const PRIN = {
  safe: { nm: '안전성', def: '투자 자산의 가치가 줄어들지 않도록 안전한 형태로 보호해야 한다는 원칙' },
  ret: { nm: '수익성', def: '보유 자산으로부터 최대한 높은 수익을 얻어야 한다는 원칙' },
  liq: { nm: '유동성', def: '보유 자산을 쉽게 현금으로 바꿀 수 있어야 한다는 원칙' }
};
/* T 표형: 만기·예금자 보호 표로 A~C(정기 예금·채권·주식)를 찾고 진술 하나를 판정. P 원칙형: A~C(수익성·안전성·유동성, C는 (가))와 진술 하나 */
function fGenExam(type) {
  const L = ['A', 'B', 'C'];
  if (type === 'T') {
    const as = shuffle(['dep', 'bond', 'stock']), of = a => L[as.indexOf(a)], yn = x => x ? '예' : '아니요';
    const X = rnd(L), Y = rnd(L.filter(l => l !== X)), ax = as[L.indexOf(X)], ay = as[L.indexOf(Y)];
    const QQ = { int: '이자 수익을 기대할 수 있는가?', gain: '시세 차익을 기대할 수 있는가?', div: '배당 수익을 기대할 수 있는가?' }, gq = rnd(Object.keys(QQ));
    const st = rnd([
      () => ({ st: `${X}는 배당 수익을 기대할 수 있다.`, tr: !!FACT[ax].div }),
      () => ({ st: `${X}는 이자 수익을 기대할 수 있다.`, tr: !!FACT[ax].int }),
      () => ({ st: `${X}는 시세 차익을 기대할 수 있다.`, tr: !!FACT[ax].gain }),
      () => ({ st: `일반적으로 ${X}는 ${Y}보다 수익성이 높다.`, tr: RANK.ret[ax] > RANK.ret[ay] }),
      () => ({ st: `일반적으로 ${X}는 ${Y}보다 안전성이 높다.`, tr: RANK.safe[ax] > RANK.safe[ay] }),
      () => { const v = Math.random() < .5; return { st: `(가)가 ‘${QQ[gq]}’라면 ${CIRC[L.indexOf(X)]}은 ‘${yn(v)}’이다.`, tr: !!FACT[ax][gq] === v }; }
    ])();
    const stem = `<p>표는 금융 자산 A~C의 특징을 나타낸다. (단, A~C는 각각 정기 예금, 주식, 채권 중 하나임.)</p><div class="tw"><table class="c-ex"><thead><tr><th>구분</th>${L.map(l => `<th>${l}</th>`).join('')}</tr></thead><tbody>
      <tr><th>일반적으로 만기가 존재하는가?</th>${as.map(a => `<td>${yn(FACT[a].mat)}</td>`).join('')}</tr><tr><th>예금자 보호 제도의 적용을 받는가?</th>${as.map(a => `<td>${yn(FACT[a].prot)}</td>`).join('')}</tr>
      <tr><th>(가)</th>${CIRC.map(c => `<td>${c}</td>`).join('')}</tr></tbody></table></div>`;
    const why = `<p>만기가 없는 ${of('stock')}는 주식, 만기가 있고 예금자 보호를 받는 ${of('dep')}는 정기 예금, 만기가 있지만 보호를 받지 않는 ${of('bond')}는 채권이다.</p>
      <p>${{ dep: '정기 예금은 이자 수익을 기대할 수 있고, 시세 차익과 배당은 없다.', bond: '채권은 이자 수익과 시세 차익을 기대할 수 있고, 배당은 없다.', stock: '주식은 시세 차익과 배당 수익을 기대할 수 있고, 이자는 없다.' }[ax]} 일반적으로 수익성은 주식 &gt; 채권 &gt; 정기 예금, 안전성은 그 반대이다.</p>`;
    return { stem, st: st.st, tr: st.tr, hint: '만기가 없는 것은 주식, 예금자 보호를 받는 것은 정기 예금이에요. 먼저 A~C가 무엇인지 찾아보세요.', why };
  }
  const order = shuffle(['safe', 'ret', 'liq']), hid = order[2], LT = k => L[order.indexOf(k)], ga = k => jo(LT(k), '이', '가'), eul = k => jo(LT(k), '을', '를');
  const q = rnd([
    () => { const v = Math.random() < .5; return { st: `일반적으로 ${v ? '채권은 주식' : '주식은 채권'}에 비해 ${ga('safe')} 높다.`, tr: v }; },
    () => { const v = Math.random() < .5; return { st: `일반적으로 ${v ? '저축성 예금은 요구불 예금' : '요구불 예금은 저축성 예금'}에 비해 ${ga('ret')} 높다.`, tr: v }; },
    () => { const k = rnd(['safe', 'liq']); return { st: `예금자 보호 제도는 ${eul(k)} 높이는 수단이 된다.`, tr: k === 'safe' }; },
    () => { const v = Math.random() < .5; return { st: `고위험을 감수하더라도 고수익을 추구하는 투자자는 ${v ? `${LT('safe')}보다 ${ga('ret')}` : `${LT('ret')}보다 ${ga('safe')}`} 높은 금융 자산을 선호할 것이다.`, tr: v }; },
    () => { const k = rnd(['safe', 'ret', 'liq']); return { st: `(가)에는 ‘${PRIN[k].def}’이 들어갈 수 있다.`, tr: k === hid }; },
    () => ({ st: `일반적으로 예금은 주식에 비해 ${ga('liq')} 낮다.`, tr: false }),
    () => { const v = Math.random() < .5; return { st: `‘100−나이’ 법칙에 따르면 나이가 많을수록 ${v ? `${LT('ret')}보다 ${eul('safe')}` : `${LT('safe')}보다 ${eul('ret')}`} 더 중시해야 한다.`, tr: v }; }
  ])();
  const stem = `<p>표는 자산 관리의 원칙 A~C를 나타낸다. (단, A~C는 각각 수익성, 안전성, 유동성 중 하나임.)</p><div class="tw"><table class="c-ex"><tbody>
    ${order.map((k, i) => `<tr><th>${L[i]}</th><td>${k === hid ? '(가)' : PRIN[k].def}</td></tr>`).join('')}</tbody></table></div>`;
  const why = `<p>${order.filter(k => k !== hid).map(k => `${LT(k)}는 ${PRIN[k].nm}`).join(', ')}이므로 ${LT(hid)}는 ${PRIN[hid].nm}이다. (가)에는 ‘${PRIN[hid].def}’이 들어갈 수 있다.</p>
    <p>일반적으로 채권은 주식보다 안전성이 높고, 저축성 예금은 요구불 예금보다 수익성이 높다. 예금자 보호 제도는 안전성을 높이는 수단이다. 예금은 유동성이 높다. 고수익을 추구하는 투자자는 수익성이 높은 자산을 선호하고, ‘100−나이’ 법칙에 따르면 나이가 많을수록 안전성을 더 중시한다.</p>`;
  return { stem, st: q.st, tr: q.tr, hint: '먼저 정의를 읽고 A~C가 무엇인지 찾아요. 남은 하나가 (가)예요.', why };
}

  }
};

async function boot() {
  buildWorld();
  await loadAssets();
  prerender();
  applyView(); resize();
  showTitle();
  requestAnimationFrame(loop);
}
boot();

</script>

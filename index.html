<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용돌이의 경제 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCEFE4; --paper:#FFFDF4; --ink:#1F2A24; --muted:#5B6B62; --line:#C9D9CF; --frame:#2B3A33;
  --grn:#178A3E; --grn2:#0F6A2F; --grnbg:#E1F4E7;
  --fish:#2F78C4; --fishbg:#E2EEFA; --fruit:#C8402F; --fruitbg:#FBE6E2;
  --ok:#1F8A55; --okbg:#DDF3E7; --no:#C23A2E; --nobg:#FBE4E1; --mid:#9A7A10; --midbg:#FFF4D6;
  --sun:#E0A21B; --shadow:rgba(0,0,0,.18);
  --fs:1.06rem;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A15; --paper:#1A2721; --ink:#E5EFE9; --muted:#9DB2A6; --line:#30443A; --frame:#A9C2B4;
    --grn:#4CC37A; --grn2:#7FE0A2; --grnbg:#173323;
    --fish:#7CB4F0; --fishbg:#16283C; --fruit:#F08A7A; --fruitbg:#3A1E1A;
    --ok:#5DCB93; --okbg:#153024; --no:#F08577; --nobg:#3B1C18; --mid:#F2C451; --midbg:#3A3015;
    --sun:#F2C451; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A15; --paper:#1A2721; --ink:#E5EFE9; --muted:#9DB2A6; --line:#30443A; --frame:#A9C2B4;
  --grn:#4CC37A; --grn2:#7FE0A2; --grnbg:#173323;
  --fish:#7CB4F0; --fishbg:#16283C; --fruit:#F08A7A; --fruitbg:#3A1E1A;
  --ok:#5DCB93; --okbg:#153024; --no:#F08577; --nobg:#3B1C18; --mid:#F2C451; --midbg:#3A3015;
  --sun:#F2C451; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root.bigtext{--fs:1.28rem}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%;overscroll-behavior:none}
/* 한국어는 낱말 중간에서 줄을 바꾸지 않는다. 아이콘과 양은 한 덩어리로 */
body{word-break:keep-all;overflow-wrap:break-word}
.nw{white-space:nowrap}
.out span{white-space:nowrap}
button{font:inherit;color:inherit}
.j,h1,h2,h3{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1400px;margin:0 auto;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ===== HUD ===== */
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:none}
.hud[hidden]{display:none}
.hud-goal{flex:1;min-width:0;background:var(--paper);border:2px solid var(--frame);border-radius:12px;padding:4px 10px;font-family:"Jua",sans-serif;font-size:1rem;line-height:1.35;box-shadow:2px 2px 0 var(--shadow)}
.hud-ch{display:inline-block;background:var(--grn);color:#fff;border-radius:7px;padding:0 7px;margin-right:6px;font-size:.85rem}
.hud-btns{display:flex;gap:6px;flex:none}
.hud-btns button{background:var(--paper);border:2px solid var(--frame);border-radius:12px;padding:4px 9px;cursor:pointer;font-family:"Jua",sans-serif;font-size:1rem;display:flex;align-items:center;gap:3px;box-shadow:2px 2px 0 var(--shadow);position:relative}
.hud-btns button.ping::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--no);border:2px solid var(--paper)}
@media (max-width:560px){.hud-btns .hl{display:none}.hud-goal{font-size:.92rem}}

/* ===== 무대 ===== */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{display:block;border:3px solid var(--frame);border-radius:14px;background:#2E7DBF;touch-action:none;box-shadow:3px 3px 0 var(--shadow)}

/* ===== 대화창 ===== */
.dlg{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,calc(100% - 16px));display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:5px double var(--frame);border-radius:14px;padding:10px 12px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;z-index:5;max-height:calc(100% - 20px);overflow:auto}
.dlg[hidden]{display:none}
.dlg-por{flex:none;width:72px;height:72px;border-radius:12px;background:var(--grnbg);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:2px solid var(--line)}
.dlg-por:empty{display:none}
.dlg-por img{width:64px;height:64px;image-rendering:pixelated}
.dlg-por img.yd{width:62px;height:78px;image-rendering:auto;margin-bottom:-8px}
.dlg-body{flex:1;min-width:0;position:relative}
.dlg-nm{display:inline-block;background:var(--grn);color:#fff;border-radius:8px;padding:0 10px;font-family:"Jua",sans-serif;font-size:.95rem;margin-bottom:3px}
.dlg-nm:empty{display:none}
.dlg-tx{font-family:"Jua",sans-serif;font-size:calc(var(--fs) * 1.1);line-height:1.55;min-height:2.6em;word-break:keep-all;overflow-wrap:anywhere}
.dlg-tri{position:absolute;right:0;bottom:-4px;color:var(--grn);font-size:.8rem;animation:blink 1s steps(1) infinite}
.dlg.typing .dlg-tri,.dlg.choosing .dlg-tri{visibility:hidden}
.dlg.choosing{cursor:default}
.dlg-ch{display:grid;gap:6px;margin-top:8px}
.dlg-ch:empty{display:none}
.dlg-ch button{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-family:"Jua",sans-serif;font-size:var(--fs);line-height:1.4;display:flex;gap:8px;align-items:baseline}
.dlg-ch button .k{flex:none;font-size:.8rem;color:var(--muted)}
.dlg-ch button:hover,.dlg-ch button:focus-visible{border-color:var(--grn);background:var(--grnbg)}
.dlg-ch button.wrong{border-color:var(--no);background:var(--nobg);color:var(--no)}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){.dlg-por{width:54px;height:54px}.dlg-por img{width:48px;height:48px}.dlg-por img.yd{width:46px;height:58px}}

/* ===== 설명 카드 ===== */
.card-ov{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 16px));max-height:max(130px,calc(100% - 210px));overflow:auto;background:var(--paper);border:3px solid var(--frame);border-radius:14px;padding:8px 12px;z-index:4;box-shadow:3px 3px 0 var(--shadow);animation:tin .3s ease-out}
.card-ov[hidden]{display:none}
.stage.has-card .card-ov{max-height:calc(44% - 8px)}
.stage.has-card .dlg{max-height:calc(56% - 18px)}
@media (max-width:560px){.dlg-ch button{padding:6px 10px;font-size:1rem}.dlg-tx{font-size:1.08rem}}
.card-ov h3{margin:2px 0 6px;color:var(--grn);font-size:1.1rem}
.card-ov p{margin:4px 0}
.prodline{font-family:"Jua",sans-serif;background:var(--grnbg);border-radius:10px;padding:4px 10px;margin:4px 0 6px!important}
.card-ov .ledger td,.card-ov .ledger th{padding:4px 5px}
.card-ov .octable th,.card-ov .octable td{padding:5px 4px}
.octable.deal{font-size:.9rem}
.octable.deal th{white-space:nowrap}
.stage.has-card .toast-wrap{position:fixed;top:6px}
@media (max-width:560px){.octable.deal{font-size:.78rem}.card-ov .octable.deal th,.card-ov .octable.deal td{padding:4px 2px}.octable.deal th{white-space:normal}}

/* 터치 버튼이 있을 때: 대화 중에는 대화창이 버튼 자리를 덮는다 */
.pad-on .dlg{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:62vh}
.pad-on .stage.has-card .dlg{max-height:62vh}

/* ===== 알림 ===== */
.toast-wrap{position:absolute;left:0;right:0;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:9}
.toast{background:var(--frame);color:var(--paper);padding:7px 14px;border-radius:12px;font-family:"Jua",sans-serif;font-size:1rem;box-shadow:2px 2px 0 var(--shadow);animation:tin .3s ease-out both;max-width:92%;text-align:center}
.toast.gold{background:var(--sun);color:#2B2208}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ===== 터치 버튼 ===== */
.pad{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;user-select:none;-webkit-user-select:none;touch-action:none}
.hud,.stage,.pad{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pad[hidden]{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,46px);gap:2px}
.dpad button{background:var(--paper);border:2px solid var(--frame);border-radius:10px;font-size:1.1rem;color:var(--ink);touch-action:none}
.dpad{touch-action:none}
.dpad button{pointer-events:none}
.dpad button.on{background:var(--grnbg);transform:scale(.96)}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
.abtn{width:68px;height:68px;border-radius:50%;background:var(--grn);color:#fff;border:3px solid var(--frame);font-family:"Jua",sans-serif;font-size:1.5rem;touch-action:none}
.abtn:active{transform:scale(.95)}
/* 가로 화면: 방향키는 왼쪽, Ⓐ는 오른쪽 기둥에 두고 지도를 가운데에 크게 (아래 버튼 줄이 지도 높이를 먹지 않게) */
@media (orientation:landscape){
  .pad-on #app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .pad-on .hud{grid-column:1/-1}
  .pad-on .stage{grid-column:2;grid-row:2}
  .pad-on .pad{display:contents}
  .pad-on .dpad{grid-column:1;grid-row:2;align-self:end;margin:0 6px 14px 12px}
  .pad-on .abtn{grid-column:3;grid-row:2;align-self:end;margin:0 14px 22px 6px}
}

/* ===== 모달 ===== */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:40}
.modal[hidden]{display:none}
.sheet{background:var(--paper);border:4px solid var(--frame);border-radius:18px;width:min(900px,100%);max-height:100%;overflow:auto;padding:14px 16px 18px;box-shadow:4px 4px 0 var(--shadow);position:relative}
.sheet h2{font-size:1.45rem;margin:0 0 4px;line-height:1.3;padding-right:44px}
.sheet h3{font-size:1.15rem;margin:12px 0 6px;color:var(--grn)}
.sheet .sub{color:var(--muted);margin:0 0 10px}
.sheet:focus,.sheet:focus-visible{outline:none}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.1rem}
.btn{font-family:"Jua",sans-serif;font-size:1.1rem;padding:10px 18px;border-radius:12px;border:none;background:var(--grn);color:#fff;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
:root[data-theme="dark"] .btn{color:#0B1A11}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0B1A11}}
:root[data-theme="dark"] .btn.ghost{color:var(--grn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--grn)}}
.btn.ghost{background:transparent;color:var(--grn);border:2px solid var(--grn);box-shadow:none}
.btn.small{font-size:.95rem;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.note{font-size:.9rem;color:var(--muted)}
.goalbar{background:var(--midbg);border-radius:12px;padding:8px 12px;margin:6px 0 10px;font-family:"Jua",sans-serif}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.85em;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor}
.fr>span{padding:0 3px}
.ic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em}
.ic.lg{width:1.6em;height:1.6em}
.icons{display:flex;flex-wrap:wrap;gap:1px;min-height:1.4em;align-items:center}
.icons .ic{width:1.15em;height:1.15em}
.icons .more{font-family:"Jua",sans-serif;font-size:.9rem;margin-left:4px}

/* 일꾼 배치판 */
.vils{display:grid;gap:10px}
.vils.two{grid-template-columns:1fr 1fr}
@media (max-width:700px){.vils.two{grid-template-columns:1fr}}
.vil{border:3px solid var(--frame);border-radius:14px;padding:10px;background:var(--bg)}
.vil-h{display:flex;align-items:center;gap:8px;font-family:"Jua",sans-serif;font-size:1.15rem}
.vil-h img{width:40px;height:40px;image-rendering:pixelated}
.prod{font-size:.95rem;margin:2px 0 6px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:92px;background:var(--paper)}
.zone.fish{border-color:var(--fish)}.zone.fruit{border-color:var(--fruit)}
.zone-h{font-family:"Jua",sans-serif;font-size:.98rem;display:flex;align-items:center;gap:4px}
.zone.fish .zone-h{color:var(--fish)}.zone.fruit .zone-h{color:var(--fruit)}
.workers{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wk{display:inline-block;width:48px;height:48px;padding:0;border-radius:10px;border:2px solid var(--line);background:var(--bg);position:relative}
.wk img{width:40px;height:40px;image-rendering:pixelated;display:block;margin:2px auto}
.wk.moved{animation:pop .3s ease-out}
button.wk{cursor:pointer}
button.wk:hover{border-color:var(--grn)}
.zones.mv3{grid-template-columns:1fr auto 1fr;gap:6px}
.mover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mover small{font-size:.72rem;color:var(--muted);white-space:nowrap}
.mv{width:44px;height:44px;border-radius:12px;border:2px solid var(--frame);background:var(--paper);color:var(--ink);font-size:1.15rem;cursor:pointer}
.mv:hover:not(:disabled){border-color:var(--grn)}
.mv:disabled{opacity:.3;cursor:default}
.seen{margin:10px 0 0;padding:8px 12px;border-radius:12px;background:var(--midbg);border:2px solid var(--mid);font-family:"Jua",sans-serif;line-height:1.5}
.ledger tr.cur td{background:var(--midbg);font-weight:700}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:none}}
.out{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;margin-top:8px;font-size:.98rem}
.out b{font-family:"Jua",sans-serif;font-weight:400;white-space:nowrap}
.need{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-family:"Jua",sans-serif;font-size:.95rem;border:2px solid var(--line);background:var(--paper)}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.chip.no{border-color:var(--no);color:var(--no);background:var(--nobg)}
.chip.mid{border-color:var(--mid);color:var(--mid);background:var(--midbg)}
.trade{border:3px solid var(--frame);border-radius:14px;padding:10px;margin-top:10px;background:var(--bg)}
.trade-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0;font-family:"Jua",sans-serif}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:2px solid var(--frame);background:var(--paper);cursor:pointer;font-size:1.2rem;line-height:1}
.step output{min-width:2.2em;text-align:center;font-family:"Jua",sans-serif;font-size:1.3rem}
.say{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:2px solid var(--frame);border-radius:12px;padding:8px 10px;margin:10px 0;font-family:"Jua",sans-serif;animation:pop .3s ease-out}
.say img{width:36px;height:36px;image-rendering:pixelated;flex:none}
.say.hint{background:var(--midbg);border-color:var(--mid)}
/* 여러 날 운영판 */
.vil-h .store{margin-left:auto;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:.9rem;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.today{font-family:"Jua",sans-serif;font-size:1.15rem;margin:2px 0 8px}
.today.storm{color:var(--no)}
.trade.storm{background:var(--nobg);border-color:var(--no)}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:4px;margin:0 0 8px}
.wx span{display:flex;flex-direction:column;align-items:center;min-width:0;padding:2px 0;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-size:1.1rem;line-height:1.25}
.wx small{font-size:.75rem;color:var(--muted)}
.wx .now{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.wx .past{opacity:.45}
.wx .scarce{border-color:var(--no)}
.wx .scarce small:last-child{color:var(--no);font-weight:700}
.wx-key{margin:-4px 0 6px}
.prep.dear{background:var(--nobg);border-color:var(--no);margin:0 0 8px}
.prep{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--midbg);border:2px solid var(--mid);font-family:"Jua",sans-serif;line-height:1.5}
.ledger{width:100%;border-collapse:collapse;margin-top:6px;font-size:.95rem}
.ledger th,.ledger td{border:1px solid var(--line);padding:5px 6px;text-align:center}
.ledger thead th{background:var(--bg);font-family:"Jua",sans-serif;font-weight:400}
.ledger tr.new td{animation:hl 1.4s ease-out}
.ledger th,.ledger td{word-break:keep-all}
.ledger th{white-space:nowrap}
.ledger .res-no,.ledger .res-ok{white-space:nowrap}
@media (max-width:560px){.ledger{font-size:.84rem}.ledger th,.ledger td{padding:4px 3px}}
@keyframes hl{from{background:var(--midbg)}}
.tw{overflow-x:auto}
.res-ok{color:var(--ok);font-family:"Jua",sans-serif}.res-no{color:var(--no);font-family:"Jua",sans-serif}

/* 값 흥정판 */
.nline{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.nline button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 0;cursor:pointer;font-family:"Jua",sans-serif;font-size:1.2rem;line-height:1.2}
.nline button small{display:block;font-size:.85rem;min-height:1.2em}
.nline button.sel{border-color:var(--frame);box-shadow:0 0 0 3px var(--sun)}
.nline button.both{background:var(--okbg);border-color:var(--ok)}
.nline button.one{background:var(--nobg);border-color:var(--no)}
.nline button.meh{background:var(--midbg);border-color:var(--mid)}
.judges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.judges{grid-template-columns:1fr}}
.judge{border:3px solid var(--frame);border-radius:14px;padding:8px 10px;background:var(--bg)}
.judge .face{font-size:2rem;line-height:1}
.judge .calc{font-size:.95rem;margin:4px 0}

.rate{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 4px;padding:8px 12px;border:3px solid var(--sun);border-radius:14px;background:var(--midbg);text-align:center}
.rate small{font-size:.85rem;color:var(--muted)}
.rate b{font-family:"Jua",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.2}
.octable tr.cur td{background:var(--midbg);font-weight:700}

.note.center{text-align:center}
/* 거울 연못 (1장 기회비용) */
.mr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.mr-pane{border:3px solid var(--frame);border-radius:14px;padding:8px 6px;text-align:center;background:var(--bg);min-width:0}
.mr-pane.mirror{border-style:dashed;border-color:var(--fish);background:linear-gradient(165deg,var(--fishbg),var(--paper))}
.mr-h{font-family:"Jua",sans-serif;font-size:.95rem}
.mr-yd{display:block;width:56px;height:auto;margin:4px auto}
.mr-pane.mirror .mr-yd{transform:scaleX(-1);opacity:.7;filter:saturate(.6) hue-rotate(-20deg)}
.mr-act{font-size:.9rem}
.mr-got{margin-top:6px;font-family:"Jua",sans-serif}
.mr-got small{display:block;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:.8rem;color:var(--muted)}
.mr-got>.ic{width:2.4em;height:2.4em}
.mr-icons{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px}
.mr-icons .ic{width:1.6em;height:1.6em}
.mr-cap{text-align:center;font-family:"Jua",sans-serif;font-size:1.1rem;margin:4px 0 10px}
.mr-q{border-top:2px dashed var(--line);padding-top:8px}
.mr-q .btn.wrong{text-decoration:line-through;opacity:.55}
/* 거울 연못 선택지 3개: 좁은 화면은 한 줄에 하나, 넓은 화면은 한 줄에 셋 (2+1로 줄바꿈되지 않게) */
.mr-q .row{display:grid;grid-template-columns:1fr}
@media (min-width:560px){.mr-q .row{grid-template-columns:repeat(3,1fr)}}
.sixth{display:inline-block;width:5.2em;height:auto}
.sixth .cut{stroke:var(--fish);stroke-width:.18;stroke-dasharray:.6 .45}
.cmp{margin:6px 0;padding:6px 12px;border-radius:12px;background:var(--grnbg);font-family:"Jua",sans-serif;line-height:1.5}
/* 3장 시장판: ① 오늘 값 ② 직접 잡기와 시장 견주기 ③ 바꿀 횟수와 계산표 */
.mk-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 12px}
@media (min-width:700px){.mk-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.mk-step{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.mk-step h3{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:1.08rem;color:var(--ink)}
.mk-n{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--grn);color:var(--paper);font-size:.85rem;flex:none}
.mk-step .rate{margin:0}
.mk-step .note{margin:6px 0 0}
.mk-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:6px}
.mk-opt{border-radius:10px;padding:6px 4px;background:var(--paper);text-align:center;font-size:.95rem;line-height:1.4}
.mk-opt-h{font-size:1rem}
.mk-opt-h small{font-size:.8rem;color:var(--muted)}
.mk-ics{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin:4px 0;min-height:1.4em}
.mk-ics .ic{width:1.1em;height:1.1em}
.mk-ics.faded .ic{opacity:.4}
.mk-plan{margin:2px 0 6px}
.mk-stop{color:var(--no)!important}
.mk-tbl{width:100%;border-collapse:collapse;font-size:.98rem;margin-top:4px}
.mk-tbl th,.mk-tbl td{border:1px solid var(--line);padding:5px 6px;text-align:center}
.mk-tbl thead th{background:var(--paper);font-family:"Jua",sans-serif;font-weight:400;white-space:nowrap}
.mk-tbl tbody th{text-align:left;font-family:"Jua",sans-serif;font-weight:400;background:var(--paper)}
.mk-tbl tr.mk-sum td{font-family:"Jua",sans-serif;font-size:1.12rem;border-top:2px solid var(--frame)}
.mk-tbl td.mk-good{color:var(--ok);background:var(--okbg);font-family:"Jua",sans-serif}
.mk-tbl td.mk-bad{color:var(--no);background:var(--nobg);font-family:"Jua",sans-serif}
.mk-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mk-btns .btn{width:100%}
.mk-btns .wide{grid-column:1/-1}

/* 심사판 */
.stem{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.98rem}
.stmt{border:2px dashed var(--frame);border-radius:12px;padding:10px 12px;margin:10px 0;font-family:"Jua",sans-serif;font-size:1.12rem}
.exam table,.fb table,.octable{border-collapse:collapse;width:100%;min-width:260px;font-size:.98rem;margin:6px 0}
.exam th,.exam td,.fb th,.fb td,.octable th,.octable td{border:1px solid var(--line);padding:7px 6px;text-align:center}
.exam thead th,.fb thead th,.octable thead th{background:var(--bg);font-weight:400;font-family:"Jua",sans-serif}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stamps .btn{font-size:1.2rem;padding:12px}
.fb{border-radius:12px;padding:10px 12px;margin:10px 0}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.no{background:var(--nobg);border-left:5px solid var(--no)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.o{background:var(--ok)}.dots i.ng{background:var(--no)}.dots i.now{background:var(--sun)}
td.win{background:var(--okbg);color:var(--ok);font-weight:700}
/* 풀이표 기회비용: 좁은 화면에서는 단위(Y재)를 늘 윗줄에 두어 칸마다 줄바꿈이 같게 */
@media (max-width:560px){.oc-u{display:block}}

/* 수첩 */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.page .octable{font-size:.88rem;min-width:0}
.page .octable th,.page .octable td{padding:4px 3px}
.page{border:3px solid var(--frame);border-radius:14px;padding:10px 12px;background:var(--bg)}
.page h3{margin:0 0 4px}
.page.locked{opacity:.6;border-style:dashed}
.page.locked h3{color:var(--muted)}
.page p{margin:4px 0}
.page .rule{background:var(--midbg);border-radius:10px;padding:6px 8px;margin:6px 0;font-family:"Jua",sans-serif}

/* 설정 */
.menu-list{display:grid;gap:8px}
.menu-list .btn{text-align:left}
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}   /* 장 4개를 어느 화면에서나 2×2로 */
.chgrid .btn{padding:10px 8px}

/* ===== 시작 화면 ===== */
.title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#BFE6F6,#7CC4E6 60%,#3E92C8);color:#13261C;overflow:auto}
.title[hidden]{display:none}
/* 가운데 맞춤은 위아래 auto 여백으로 한다. justify-content:center는 화면보다 길 때 위쪽이 잘려 스크롤로도 볼 수 없다 */
.title>.t-hero{margin-top:auto}
.title>.t-act{margin-bottom:auto}
.t-hero,.t-act{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.title .logo{width:min(9rem,40%);border-radius:8px;border:3px solid #2B3A33;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.title h1{font-size:clamp(2rem,7vw,3.2rem);margin:6px 0 0;color:#0F5A28;text-shadow:2px 2px 0 #fff}
.title .tag{font-family:"Jua",sans-serif;font-size:1.1rem;margin:0;color:#173A27}
.title .yd{width:8.5rem;height:10.6rem;animation:bob 2.4s ease-in-out infinite}
.title .crew{display:flex;gap:6px;align-items:flex-end;justify-content:center}
.title .crew img.m{width:56px;height:56px;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.title .crew img.m:nth-child(3){animation-delay:.4s}
/* 버튼은 2×2 칸에 고정 */
.title .tbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,24rem);margin-top:8px}
.title .tbtns .btn{width:100%;font-size:1.2rem;padding:12px 6px;white-space:nowrap}
.title .tbtns .wide{grid-column:1/-1}
.title .btn.ghost{background:rgba(255,255,255,.7);color:#0F5A28;border-color:#0F5A28}
.title .small-note{font-size:.85rem;color:#173A27;margin:8px 0 0}
.title .save-who{margin:8px 0 0;padding:6px 14px;border-radius:12px;background:rgba(255,255,255,.75);color:#13261C;line-height:1.45}
.title .save-who small{font-size:.85rem;color:#173A27}
/* 가로로 눕힌 휴대폰: 그림 쪽과 버튼 쪽을 나란히 */
@media (orientation:landscape) and (max-height:560px){
  .title{flex-direction:row;justify-content:center;align-items:flex-start;gap:28px;padding:10px 16px}
  .title>.t-hero,.title>.t-act{margin:auto 0;width:auto;flex:0 1 24rem}
  .title .logo{width:5.5rem}
  .title h1{font-size:1.9rem;margin:2px 0 0}
  .title .tag{font-size:1rem}
  .title .yd{width:6rem;height:7.5rem}
  .title .crew img.m{width:44px;height:44px}
}
.octable.nw th,.octable.nw td{white-space:nowrap}
@keyframes bob{50%{transform:translateY(-6px)}}
.fade{position:fixed;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}

@media (prefers-reduced-motion: reduce){
  /* transition-duration을 0보다 크게 하면 transition-property 기본값(all) 때문에 모든 속성 변화가 전환되어, 바뀐 직후 잰 위치·크기가 옛 값이 된다 */
  *{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}
}

/* 좁은 휴대폰: 일꾼 칸이 한 줄에 둘씩 들어가게 */
@media (max-width:400px){.wk{width:42px;height:42px}.wk img{width:36px;height:36px}.zone{padding:5px}.zones.mv3{gap:4px}.mv{width:40px;height:40px}}

/* 일하는 하루 (지도에서 직접 채취) */
.workbar{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;top:8px;z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;max-width:calc(100% - 16px);padding:6px 12px;border:3px solid var(--frame);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--shadow);font-family:"Jua",sans-serif;font-size:1rem}
.workbar .wb-clock b{font-size:1.3rem;color:var(--grn2)}
.workbar button{font:inherit;font-size:.9rem;padding:4px 10px;border:2px solid var(--frame);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.workbar .wb-msg{flex-basis:100%;text-align:center;font-size:.95rem;animation:pop .3s ease-out}
.workbar .wb-msg small{font-size:.8rem;color:var(--muted)}
.fishing{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border:3px solid var(--fish);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--shadow);font-family:"Jua",sans-serif;text-align:center;max-width:calc(100% - 32px)}
.fishing .bob{font-size:2.4rem;animation:bob 1.2s ease-in-out infinite}
.fishing.bite{border-color:var(--no);background:var(--nobg)}
.fishing.bite .bob{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.fishing .bob{animation:none}}
@media (max-width:560px){.workbar{gap:2px 8px;padding:4px 8px;font-size:.88rem;top:4px}.workbar .wb-clock b{font-size:1.1rem}.workbar button{font-size:.8rem;padding:2px 8px}}
/* 가로로 눕힌 휴대폰: 지도가 낮으니 작업 막대를 얇게 */
@media (orientation:landscape) and (max-height:560px){.workbar{gap:0 8px;padding:2px 8px;font-size:.84rem;top:4px;line-height:1.35}.workbar .wb-clock b{font-size:1.05rem}.workbar button{font-size:.78rem;padding:1px 8px}.workbar .wb-msg{font-size:.8rem}}
/* 행운 폭죽 */
.fx{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fx i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;opacity:0;animation:spark .9s ease-out forwards}
.fx b{position:absolute;margin:-.6em 0 0 -.6em;font-size:2.4rem;line-height:1.2;font-weight:400;animation:pop .4s ease-out,fxfade 1.5s ease-in forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes fxfade{0%,70%{opacity:1}100%{opacity:0}}
.luck{color:var(--ok);font-weight:700}

/* 가로로 눕힌 휴대폰: 높이가 낮아 카드와 대화창을 위아래로 쌓으면 서로 가린다. 카드는 왼쪽, 대화창은 오른쪽에 나란히 */
@media (orientation:landscape) and (max-height:560px){
  :root .dlg{max-height:calc(100dvh - var(--hud-h,50px) - 16px)}
  :root .dlg-por{width:54px;height:54px}
  :root .dlg-por img{width:48px;height:48px}
  :root .dlg-por img.yd{width:46px;height:58px}
  :root .stage.has-card .card-ov{position:fixed;top:calc(var(--hud-h,50px) + 6px);left:calc(8px + env(safe-area-inset-left,0px));transform:none;width:calc(50% - 12px);max-height:calc(100dvh - var(--hud-h,50px) - 14px)}
  :root .stage.has-card .dlg{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:auto;right:calc(8px + env(safe-area-inset-right,0px));transform:none;width:calc(50% - 12px);max-height:calc(100dvh - var(--hud-h,50px) - 14px)}
}
/* 합리적 선택 단원 · 단원 고르기 */
.wallet{display:inline-block;background:var(--midbg);border:2px solid var(--sun);border-radius:8px;padding:0 6px;margin-right:6px;font-size:.85rem}
.title .tbtns .unit{white-space:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;font-size:1.08rem;padding:10px 6px}
.title .tbtns .unit .save-who{font-size:.78rem;opacity:.92;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.ubtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ubtns .btn{width:100%}
.utabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}
.utabs button{font-family:"Jua",sans-serif;font-size:1rem;padding:8px 6px;border:2px solid var(--grn);border-radius:10px;background:transparent;color:var(--grn);cursor:pointer}
.utabs button.on{background:var(--grn);color:var(--paper)}
.mr.mr3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mr3 .mr-pane{padding:6px 3px}
.mr3 .mr-yd{width:40px}
.mr3 .mr-act,.mr3 .mr-got{font-size:.85rem}
.c-tbl th small{font-size:.75rem;color:var(--muted)}
.c-tbl th.me,.c-tbl td.me{background:var(--midbg)}
.c-tbl td.c-q{color:var(--muted)}
.c-tbl tr.c-sunk th,.c-tbl tr.c-sunk td{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,127,127,.12) 6px 12px)}
.c-gone{color:var(--muted);text-decoration:line-through}
.c-fill{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.kite-card{text-align:center;font-size:2rem}
/* 뒤로 가기 한 번: 알림만 (한 번 더 누르면 나간다) */
.backmsg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:rgba(20,30,25,.9);color:#fff;padding:10px 16px;border-radius:12px;font-family:"Jua",sans-serif;font-size:1rem;max-width:calc(100% - 32px);text-align:center;pointer-events:none;animation:pop .3s ease-out}
.mr-q.c-one .row{grid-template-columns:1fr}
.c-tbl thead th{white-space:normal;line-height:1.25}
@media (max-width:560px){.c-tbl{font-size:.86rem}.c-tbl th,.c-tbl td{padding:4px 3px}.c-tbl tbody th small{display:none}}
.exam table.c-ex,.fb table.c-ex{min-width:0}
.c-ex th,.c-ex td{padding:5px 4px}
.c-ex small{font-size:.75rem;color:var(--muted)}
.c-unit{text-align:right;margin:2px 0 -2px}

/* ===== ② 자산 관리와 금융 생활 ===== */
.title .t-snd{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));min-height:44px;padding:6px 12px;border-radius:12px;border:2px solid #0F5A28;background:rgba(255,255,255,.75);color:#0F5A28;font-family:"Jua",sans-serif;font-size:.95rem;cursor:pointer}
.utabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.utabs button{font-size:.92rem;line-height:1.25;padding:6px 4px}
.f-led,.f-price,.f-year,.f-pay{font-size:.92rem}
.f-led td,.f-led th{padding:4px 5px}
.f-led tbody th small,.f-price th small,.f-year th small,.f-cmp th small{display:block;font-size:.75rem;color:var(--muted);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.f-led td small{color:var(--muted);font-size:.78rem}
.f-pay{max-width:22rem;margin:4px auto}
.f-logd{margin:6px 0 10px}
.f-logd summary{cursor:pointer;font-family:"Jua",sans-serif;color:var(--grn)}
.f-log{margin:6px 0;padding-left:1.1em;font-size:.9rem;line-height:1.5}
.f-log li.f-s{list-style:none;margin:6px 0 2px -1.1em;font-family:"Jua",sans-serif;color:var(--grn)}
.f-accts,.f-certs,.f-ways{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:8px 0}
@media (min-width:600px){.f-accts,.f-ways{grid-template-columns:repeat(3,minmax(0,1fr))}.f-certs{grid-template-columns:1fr 1fr}}
.f-acct,.f-cert,.f-way{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);text-align:center}
.f-acct.on,.f-cert.on,.f-way.on{border-color:var(--ok);background:var(--okbg)}
.f-acct p,.f-cert p,.f-way p{margin:4px 0;font-size:.95rem}
.f-acct-h,.f-cert-h{font-family:"Jua",sans-serif;font-size:1.05rem}
.f-cert{border-style:double;border-width:4px;border-color:#B47C46;background:#FFF8E6;color:#2B2208}
/* 증서는 어두운 화면에서도 종이색이고 글자색이 고정이다. 산 뒤 배경도 고정한다(어두운 초록이면 글자가 안 보였다) */
.f-cert.on{border-color:var(--ok);background:#DDF3E7}
.f-cert .ok-t{color:#1F8A55}
.card-ov .f-certs{grid-template-columns:1fr 1fr}
.card-ov .f-cert p{font-size:.85rem}
.ok-t{color:var(--ok);font-family:"Jua",sans-serif}
.f-way small{color:var(--muted)}
.f-g{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.f-g.done{background:var(--okbg);border-color:var(--ok)}
.f-g small{display:block;color:var(--muted)}
.f-gq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.f-gq .btn.wrong{text-decoration:line-through;opacity:.55}
.f-jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.f-jars div{background:var(--grnbg);border-radius:10px;padding:6px 4px;text-align:center;font-size:.9rem}
.f-jars small{display:block;color:var(--muted);font-size:.78rem}
.f-mine{margin:4px 0;padding-left:1.2em;font-size:.95rem}
.f-cmp{font-size:.9rem}
.f-cmp tbody th{font-size:.88rem}
.f-ox td{padding:2px}
.f-cell{width:100%;min-width:44px;min-height:44px;border:2px dashed var(--line);border-radius:10px;background:var(--paper);font-family:"Jua",sans-serif;font-size:1.3rem;cursor:pointer;color:var(--ink)}
.f-cell.wrong{border-color:var(--no);border-style:solid;background:var(--nobg)}
.f-cell:disabled{cursor:default;border-style:solid;border-color:var(--ok)}
.f-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.f-chip{min-height:44px}
.f-chip.on{background:var(--grnbg);border-color:var(--grn)}
.f-chip b{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--grn);color:var(--paper);font-size:.85rem}
.mk-step.good{border-color:var(--ok);background:var(--okbg)}
.mk-step.badrow{border-color:var(--no)}
.f-bas-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.f-bk{border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;background:var(--paper);min-width:0}
.f-bk small{display:block;font-size:.78rem;color:var(--muted);line-height:1.3}
.f-bk b{display:block;font-family:"Jua",sans-serif;font-size:1.4rem}
.f-eggs{display:block;font-size:.8rem;line-height:1.2;word-break:break-all;min-height:1.2em}
.f-mv{display:flex;flex-direction:column;gap:6px}
.f-mv .btn{min-width:44px;min-height:44px}
.f-graph{display:block;width:min(100%,300px);margin:6px auto;color:var(--ink)}
.card-ov .f-graph{width:min(100%,240px)}
.f-accts .btn,.f-certs .btn,.f-ways .btn,.f-mat .btn,.f-gq .btn{min-height:44px}
.f-mat th,.f-mat td{padding:4px 4px}
.f-year thead th,.f-led thead th,.f-price thead th,.f-mat thead th{white-space:normal;line-height:1.25}
@media (max-width:560px){
  .f-year,.f-led,.f-price,.f-mat,.f-cmp{font-size:.8rem}
  .f-year th,.f-year td,.f-led th,.f-led td,.f-price th,.f-price td,.f-mat th,.f-mat td,.f-cmp th,.f-cmp td{padding:3px 2px}
  .f-cmp tbody th{font-size:.78rem}
  .f-jars div{font-size:.8rem}
}
/* 가로로 눕힌 휴대폰: 오른쪽 위는 단원 단추 자리라 소리 단추를 왼쪽 위(그림 쪽 빈자리)로 */
@media (orientation:landscape) and (max-height:560px){.title .t-snd{right:auto;left:calc(10px + env(safe-area-inset-left,0px))}}
@media (max-width:420px),(max-height:420px){.title .t-snd{min-width:44px;padding:6px 8px}.title .t-snd-tx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
/* 누르는 것은 모두 44px 이상(교사 결정 2026-10-26): 머리 줄 단추, 창 닫기 ✕, 작은 단추, 대화 선택지, 장 선택 탭 */
.hud-btns button{min-height:44px;min-width:44px;justify-content:center}
.x{width:44px;height:44px}
.sheet h2{padding-right:52px}
.btn,.dlg-ch button,.utabs button{min-height:44px}

</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="hud-goal"><span class="hud-ch" id="hud-ch"></span><span id="hud-goal"></span></div>
    <div class="hud-btns">
      <button type="button" id="btn-note" title="수첩 (N)">📒<span class="hl">수첩</span></button>
      <button type="button" id="btn-hint" title="동료에게 묻기 (H)">💬<span class="hl">동료</span></button>
      <button type="button" id="btn-menu" title="설정 (Esc)">⚙️<span class="hl">설정</span></button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="섬 지도. 방향키로 움직이고 스페이스로 말을 겁니다."></canvas>
    <div class="dlg" id="dlg" hidden>
      <div class="dlg-por" id="dlg-por"></div>
      <div class="dlg-body">
        <span class="dlg-nm" id="dlg-nm"></span>
        <div class="dlg-tx" id="dlg-tx" aria-live="polite"></div>
        <div class="dlg-ch" id="dlg-ch"></div>
        <span class="dlg-tri" id="dlg-tri">▼</span>
      </div>
    </div>
    <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  </div>
  <div class="pad" id="pad" hidden>
    <div class="dpad">
      <button type="button" data-d="up" aria-label="위">▲</button>
      <button type="button" data-d="left" aria-label="왼쪽">◀</button>
      <button type="button" data-d="right" aria-label="오른쪽">▶</button>
      <button type="button" data-d="down" aria-label="아래">▼</button>
    </div>
    <button type="button" class="abtn" id="abtn" aria-label="말 걸기">A</button>
  </div>
  <div class="title" id="title"></div>
</div>

function buildWorld() {

  // --- 교역섬
  clearRect(24, 13, 32, 20);

  // --- 여우섬

  WORK_PLACES.fox.trees.forEach(([x, y]) => place(x, y, T.FRUIT));
  // --- 박람회섬
  clearRect(22, 1, 34, 8);
  pathV(28, 4, 8); pathH(23, 33, 6); pier(28, 9, 0, 1, 2, K('fair'));

  // --- 작은 섬
  place(26, 38, T.PALM); place(53, 37, T.PALM); place(53, 3, T.PALM);
  // 물건 자리 비우기
  OBJS.forEach(o => { for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) { if (tAt(x, y) !== T.PIER) setT(x, y, isLandT(tAt(x, y)) && tAt(x, y) !== T.SAND ? T.GRASS : tAt(x, y)); reserve(x, y); } });
  // 나무·꽃·바위 흩뿌리기
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = ix(x, y), t = map[i]; if (RESERVED.has(i) || !isl[i]) continue;
    const I = ISLANDS[isl[i] - 1]; if (I.tiny) continue;
    const d = Math.hypot((x - I.cx) / I.rx, (y - I.cy) / I.ry), r = hash(x, y, 7);
    if (t === T.GRASS) { if (d > .58 && r < .42) map[i] = T.TREE; else if (r > .9) map[i] = T.FLOWER; }
    else if (t === T.SAND && r < .05) map[i] = T.ROCK;

  const anyObj = (x, y) => OBJS.some(o => x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = ix(x, y); if (map[i] === T.GRASS && RESERVED.has(i) && !anyObj(x, y) && hash(x, y, 9) > .9) map[i] = T.FLOWER; }
}

const cv = $('cv'), ctx = cv.getContext('2d');
let VW = 15, VH = 11, SC = 1, DPR = 1;
const terr = canvas(W * TILE, H * TILE);
const px = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };

function drawWater(g, X, Y, x, y) {
  px(g, X, Y, 32, 32, '#3A8DD0');
  if (hash(x, y, 3) < .4) px(g, X + 6 + ((hash(x, y, 4) * 16) | 0), Y + 8 + ((hash(x, y, 5) * 16) | 0), 8, 2, '#4C9CDB');
  const L = (dx, dy) => isLandT(tAt(x + dx, y + dy));
  if (L(0, -1)) { px(g, X, Y, 32, 7, '#6EC3EA'); px(g, X, Y + 7, 32, 2, '#E3F6FC'); }
  if (L(0, 1)) { px(g, X, Y + 25, 32, 7, '#6EC3EA'); px(g, X, Y + 23, 32, 2, '#E3F6FC'); }
  if (L(-1, 0)) { px(g, X, Y, 7, 32, '#6EC3EA'); px(g, X + 7, Y, 2, 32, '#E3F6FC'); }
  if (L(1, 0)) { px(g, X + 25, Y, 7, 32, '#6EC3EA'); px(g, X + 23, Y, 2, 32, '#E3F6FC'); }
}
function drawSand(g, X, Y, x, y) { px(g, X, Y, 32, 32, '#EED8A0'); for (let i = 0; i < 4; i++) px(g, X + 2 + ((hash(x, y, 10 + i) * 28) | 0), Y + 2 + ((hash(x, y, 20 + i) * 28) | 0), 2, 2, '#D8BC7C'); }
function drawGrass(g, X, Y, x, y) {
  px(g, X, Y, 32, 32, '#7BC25C');
  for (let i = 0; i < 3; i++) { const gx = X + 2 + ((hash(x, y, 30 + i) * 26) | 0), gy = Y + 2 + ((hash(x, y, 40 + i) * 24) | 0); px(g, gx, gy, 2, 4, '#5FA845'); px(g, gx + 2, gy + 2, 2, 2, '#5FA845'); }
  if (hash(x, y, 50) < .35) px(g, X + 2 + ((hash(x, y, 51) * 26) | 0), Y + 2 + ((hash(x, y, 52) * 26) | 0), 2, 2, '#A3DB80');
}
function drawPath(g, X, Y, x, y) { px(g, X, Y, 32, 32, '#D9B57B'); for (let i = 0; i < 3; i++) px(g, X + 2 + ((hash(x, y, 60 + i) * 26) | 0), Y + 2 + ((hash(x, y, 70 + i) * 26) | 0), 4, 2, '#C29A5F'); }
function drawFlower(g, X, Y, x, y) {
  drawGrass(g, X, Y, x, y);
  const cols = ['#FFFFFF', '#F7A1C4', '#9FC4F7', '#F9E27D'];
  for (let i = 0; i < 2; i++) {
    const fx = X + 6 + ((hash(x, y, 80 + i) * 18) | 0), fy = Y + 6 + ((hash(x, y, 90 + i) * 18) | 0), c = cols[(hash(x, y, 95 + i) * 4) | 0];
    px(g, fx - 2, fy, 2, 2, c); px(g, fx + 2, fy, 2, 2, c); px(g, fx, fy - 2, 2, 2, c); px(g, fx, fy + 2, 2, 2, c); px(g, fx, fy, 2, 2, '#F2C451');
  }
}
function drawCanopy(g, X, Y, base, dark, light) {
  px(g, X + 12, Y + 22, 8, 9, '#7A5233'); px(g, X + 8, Y + 29, 16, 2, 'rgba(0,0,0,.15)');
  px(g, X + 8, Y + 3, 16, 4, base); px(g, X + 5, Y + 6, 22, 14, base); px(g, X + 3, Y + 9, 26, 8, base);
  px(g, X + 5, Y + 17, 22, 5, dark); px(g, X + 9, Y + 6, 7, 3, light); px(g, X + 7, Y + 9, 3, 3, light);
}
function drawTile(g, x, y) {
  const X = x * TILE, Y = y * TILE, t = tAt(x, y);
  switch (t) {
    case T.WATER: drawWater(g, X, Y, x, y); break;
    case T.SAND: drawSand(g, X, Y, x, y); break;
    case T.GRASS: drawGrass(g, X, Y, x, y); break;
    case T.PATH: drawPath(g, X, Y, x, y); break;
    case T.FLOWER: drawFlower(g, X, Y, x, y); break;
    case T.TREE: drawGrass(g, X, Y, x, y); drawCanopy(g, X, Y, '#3E8E3A', '#2F6E2C', '#63B357'); break;
    case T.FRUIT: {
      drawGrass(g, X, Y, x, y); drawCanopy(g, X, Y, '#4C9C42', '#3A7C33', '#70BD5E');
      [[9, 8], [18, 6], [14, 12], [21, 12], [8, 15]].forEach(([a, b]) => { px(g, X + a, Y + b, 4, 4, '#D8452F'); px(g, X + a, Y + b, 1, 1, '#F49A85'); });
      break;
    }

/* ---------- 길 찾기 (누른 곳으로 걷기) ---------- */
function findPath(goalTest, mode, limit = 2500) {
  const start = ix(P.x, P.y), prev = new Map([[start, -1]]), q = [start];
  let found = -1;
  while (q.length && prev.size < limit) {
    const cur = q.shift(), x = cur % W, y = (cur - x) / W;
    if (cur !== start && goalTest(x, y)) { found = cur; break; }
    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue; const k = ix(nx, ny); if (prev.has(k)) continue;
      const ok = walkable(nx, ny, mode) || goalTest(nx, ny);
      if (!ok) continue;
      prev.set(k, cur);
      if (goalTest(nx, ny)) { found = k; q.length = 0; break; }
      if (walkable(nx, ny, mode)) q.push(k);

function dirTo(a, b) { return b.x > a.x ? 'right' : b.x < a.x ? 'left' : b.y > a.y ? 'down' : 'up'; }

  if (G.work && P.mode === 'land' && workTap(tx, ty)) return;
  if (G.job && P.mode === 'land' && jobTap(tx, ty)) return;
  const n = npcAt(tx, ty), o = objAt(tx, ty), fw = P.mode === 'land' ? followerAt(tx, ty) : null;
  if (fw) { run(hintTalk); return; }
  const target = n || (o && o.act ? o : null);
  if (target && P.mode === 'land') {
    const adj = (x, y) => Math.abs(x - tx) + Math.abs(y - ty) === 1 && walkable(x, y, 'land');
    if (Math.abs(P.x - tx) + Math.abs(P.y - ty) === 1) { P.dir = dirTo(P, { x: tx, y: ty }); interact(); return; }
    const path = findPath(adj, 'land');
    if (path) { P.path = path; P.after = () => { P.dir = dirTo(P, { x: tx, y: ty }); interact(); }; }
    return;
  }
  if (P.mode === 'land') {
    if (walkable(tx, ty, 'land')) { const p = findPath((x, y) => x === tx && y === ty, 'land'); if (p) { P.path = p; P.after = null; } return; }
    if (isWaterT(tAt(tx, ty))) {
      const shore = (x, y) => walkable(x, y, 'land') && [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([a, b]) => isWaterT(tAt(x + a, y + b)) && !fogged(x + a, y + b));

        if (!shore(x, y)) continue; const d = Math.abs(x - tx) + Math.abs(y - ty); if (d < bd) { bd = d; best = { x, y }; }
      }
      if (!best) return;
      const toShore = best.x === P.x && best.y === P.y ? [] : findPath((x, y) => x === best.x && y === best.y, 'land');
      if (!toShore) return;
      const wdir = Object.entries(DIRS).sort((a, b) => (Math.abs(best.x + a[1][0] - tx) + Math.abs(best.y + a[1][1] - ty)) - (Math.abs(best.x + b[1][0] - tx) + Math.abs(best.y + b[1][1] - ty))).find(([, [a, b]]) => isWaterT(tAt(best.x + a, best.y + b)) && !fogged(best.x + a, best.y + b));

    }

  }

    return new Promise(res => {
      this.show(who); this.mode = 'choose'; this.resolve = null; $('dlg').classList.add('choosing');
      this.type(html, () => {
        const box = $('dlg-ch');
        box.innerHTML = (order || opts.map((_, i) => i)).map((i, k) => `<button type="button" data-i="${i}" class="${wrong.includes(i) ? 'wrong' : ''}"><span class="k">${k + 1}</span><span>${opts[i]}</span></button>`).join('');
        box.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); sfx('sel'); this.pick = null; box.innerHTML = ''; $('dlg').classList.remove('choosing'); res(+b.dataset.i); });
        this.pick = k => { const b = box.querySelectorAll('button')[k]; if (b) b.click(); };
        ghostMark();
        refit();
        const first = box.querySelector('button:not(.wrong)') || box.querySelector('button'); if (first) try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); }
      });
    });
  },
  advance() {
    if (!this.active) return;
    if (this.timer) { this.finish(); return; }
    if (this.mode === 'say' && this.resolve) { const r = this.resolve; this.resolve = null; sfx('sel'); r(); }
  },
  close() { ghostMark(); this.stop(); $('dlg').hidden = true; $('dlg').classList.remove('typing', 'choosing'); this.active = false; this.mode = ''; this.pick = null; }
};
$('dlg').addEventListener('click', () => { if (Dlg.mode === 'say') Dlg.advance(); else if (Dlg.timer) Dlg.finish(); });

/* 퀴즈 선택지는 보여 줄 때마다 섞는다(정답이 늘 같은 자리에 있지 않게). 한 문제 안에서는 순서를 고정한다 */
const optOrder = n => shuffle(Array.from({ length: n }, (_, i) => i));
async function quiz(who, text, opts, ans, fb = {}, fbWho) {
  const wrong = [], order = optOrder(opts.length);
  S.stats.q++;
  for (;;) {
    const c = await Dlg.choose(who, text, opts, wrong, order);
    if (c === ans) { sfx('ok'); if (wrong.length) S.stats.qw++; return wrong.length; }
    sfx('no'); if (!wrong.includes(c)) wrong.push(c);
    await Dlg.say(fbWho || who, fb[c] || '다시 생각해 보자.');
  }
}

function openHint(H) {

/* 행운 굴리기: 평소 n개를 얻을 때, LUCK_P 확률로 평소보다 많은 2~4개. 하루에 LUCK_PER_DAY번까지.

   거울 연못 (1장 기회비용): 내가 한 일과 거울 속 내가 한 다른 일을 나란히 본다.
   거울 속 내가 가진 것 = 내가 포기한 것 = 기회비용. 둘째 장면은 1시간으로 역수를 본다.
   ========================================================= */
function mirrorBoard() {
  return new Promise(resolve => {
    const H = HR.r, n = H.fish / H.fruit;   // 물고기 1마리 시간에 딸 수 있는 열매 수
    /* 물고기를 n칸으로 나눠 첫 칸만 진하게 */
    const inner = IC.fish.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, ''), w = 16 / n;
    const sixth = `<svg class="sixth" viewBox="-.5 -1.5 17 10" role="img" aria-label="물고기 ${n}분의 1마리"><defs><clipPath id="mr-clip"><rect x="-1" y="-2" width="${w + 1}" height="12"/></clipPath></defs>
      <g opacity=".2">${inner}</g><g clip-path="url(#mr-clip)">${inner}</g>${Array.from({ length: n - 1 }, (_, k) => `<line x1="${((k + 1) * w).toFixed(2)}" y1="-1" x2="${((k + 1) * w).toFixed(2)}" y2="8" class="cut"/>`).join('')}</svg>`;
    const st = { step: 1, pick: null, ok: false, wrong: [], said: '', ord: null };   // ord: 선택지를 보여 줄 순서(질문마다 한 번 섞음)
    const sh = openModal(false);
    const pane = (mirror, act, got) => `<div class="mr-pane${mirror ? ' mirror' : ''}"><div class="mr-h">${mirror ? '🪞 거울 속 용돌이' : '🐲 이 세계의 용돌이'}</div>
      <img class="mr-yd" src="${PORT.yd}" alt=""><div class="mr-act">${act}</div><div class="mr-got"><small>얻은 것</small>${got}</div></div>`;
    const Q = () => st.step === 1
      ? (st.pick === 'fish'
        ? { q: `물고기 1마리를 얻으려고 포기한 것, 곧 물고기 1마리의 기회비용은?`, o: [`열매 ${n}개`, '물고기 1마리', '아무것도 없다'], a: 0, fb: { 1: '물고기 1마리는 네가 얻은 거야. 거울 속 내가 가진 것을 봐.', 2: '6시간을 낚시에 쓰느라 못 한 일이 있지. 거울 속을 봐.' } }
        : { q: `열매 ${n}개를 얻으려고 포기한 것, 곧 열매 ${n}개의 기회비용은?`, o: ['물고기 1마리', `열매 ${n}개`, '아무것도 없다'], a: 0, fb: { 1: `열매 ${n}개는 네가 얻은 거야. 거울 속 내가 가진 것을 봐.`, 2: '6시간을 열매 따기에 쓰느라 못 한 일이 있지. 거울 속을 봐.' } })
      : { q: '열매 1개를 얻으려고 포기한 것, 곧 열매 1개의 기회비용은?', o: [`물고기 ${fr(1, n)}마리`, `물고기 ${n}마리`, '열매 1개'], a: 0, fb: { 1: `물고기 ${n}마리를 잡으려면 ${n * H.fish}시간이 들어. 거울 속 용돌이는 1시간만 낚시했어.`, 2: '열매 1개는 네가 얻은 거야. 거울 속을 봐.' } };
    const render = () => {
      let body;
      if (st.step === 1 && !st.pick) {
        body = `<p class="sub">오후 ${H.fish}시간이 남았어요. 낚시와 열매 따기 가운데 하나만 할 수 있어요. 무엇을 할까요?</p>
          <div class="row center"><button type="button" class="btn" id="mr-fish">🎣 낚시하기 (${H.fish}시간)</button><button type="button" class="btn" id="mr-fruit">🌳 열매 따기 (${H.fish}시간)</button></div>`;
      } else {
        const fishAct = `🎣 낚시 ${H.fish}시간`, fruitAct = `🌳 열매 따기 ${H.fish}시간`, fishGot = IC.fish, fruitGot = `<span class="mr-icons">${IC.fruit.repeat(n)}</span>`;
        const panes = st.step === 1
          ? (st.pick === 'fish' ? pane(false, fishAct, fishGot) + pane(true, fruitAct, fruitGot) : pane(false, fruitAct, fruitGot) + pane(true, fishAct, fishGot))
          : pane(false, `🌳 열매 따기 ${H.fruit}시간`, IC.fruit) + pane(true, `🎣 낚시 ${H.fruit}시간`, `${sixth}<br><small>물고기 <span class="nw">${fr(1, n)}마리</span></small>`);
        const q = Q();
        body = `<p class="sub">${st.step === 1 ? '거울 연못에 비친 다른 세계의 용돌이는 다른 일을 했어요.' : `이번엔 ${H.fruit}시간만 남았어요. 용돌이는 열매를 땄고, 거울 속 용돌이는 낚시를 했어요.`}</p>
          <div class="mr">${panes}</div><div class="mr-cap">거울 속 내가 가진 것 = <b>내가 포기한 것</b></div>
          <div class="mr-q"><b>${q.q}</b><div class="row">${(st.ord = st.ord || optOrder(q.o.length)).map(i => `<button type="button" class="btn ghost${st.wrong.includes(i) ? ' wrong' : ''}" data-a="${i}" ${st.ok || st.wrong.includes(i) ? 'disabled' : ''}>${q.o[i]}</button>`).join('')}</div></div>`;
      }
      sh.innerHTML = `<h2>🪞 거울 연못</h2>${body}${st.said}
        <div class="row">${st.ok ? `<button type="button" class="btn" id="${st.step === 1 ? 'mr-step2' : 'mr-next'}">${st.step === 1 ? '다음 장면 ▶' : '다음 ▶'}</button>` : ''}</div>`;
      const pick = k => { sfx('sel'); st.pick = k; S.stats.q++; render(); };
      const f = sh.querySelector('#mr-fish'); if (f) f.onclick = () => pick('fish');
      const r = sh.querySelector('#mr-fruit'); if (r) r.onclick = () => pick('fruit');
      sh.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        const i = +b.dataset.a, q = Q();
        if (i === q.a) {
          sfx('ok'); st.ok = true; if (st.wrong.length) S.stats.qw++;
          st.said = sayHTML('rchief', st.step === 1 ? `맞아. 어느 쪽을 골랐든 물고기 1마리와 열매 ${n}개는 서로의 기회비용이란다.` : `물고기 1마리 = 열매 ${n}개를 거꾸로 보면 열매 1개 = 물고기 ${fr(1, n)}마리. 서로 뒤집힌 수지.`);
        } else { sfx('no'); st.wrong.push(i); st.said = sayHTML('rchief', q.fb[i] || '다시 생각해 보렴.'); }
        render(); scrollSay(sh);
      });
      const s2 = sh.querySelector('#mr-step2'); if (s2) { s2.onclick = () => { sfx('sel'); st.step = 2; st.ok = false; st.wrong = []; st.said = ''; st.ord = null; S.stats.q++; render(); }; setTimeout(() => s2.focus(), 50); }
      const nx = sh.querySelector('#mr-next'); if (nx) { nx.onclick = () => { sfx('sel'); closeModal(); resolve(st.pick); }; setTimeout(() => nx.focus(), 50); }
    };
    render();
  });
}

/* =========================================================
   시장판 (3장): 일을 마친 뒤에야 그날 값이 공개된다.
   열매를 내고 곰 마을 물고기를 몇 번 바꿀지 고른다.
   ========================================================= */
function drawRate(tries) {
  if (G.forceRate != null) return RATES[G.forceRate];
  const last = tries.length ? tries[tries.length - 1].rate : null;
  return rnd(RATES.filter(r => r !== last));
}
function ledgerMarket(tries, cur) {
  if (!tries.length) return '<h3>📒 장부</h3><p class="note">아직 시장에 간 날이 없어요.</p>';
  const body = tries.map((t, i) => { const [a, b] = t.rate;
    return `<tr class="${i === tries.length - 1 && cur === 'last' ? 'new' : ''} ${cur && cur.fish != null && t.made.fish === cur.fish ? 'cur' : ''}"><td>${i + 1}일</td><td>${stockTxt(t.made)}</td><td><span class="nw">${IC.fish}${a}=${IC.fruit}${b}</span></td><td>${t.n ? `<span class="nw">${IC.fruit}${b * t.n}→${IC.fish}${a * t.n}</span>` : '—'}</td><td>${shortIcon(t.after, t.need || NEED)}</td></tr>`; }).join('');
  return `<h3>📒 장부 (시장에 간 날 ${tries.length}일)</h3><div class="tw"><table class="ledger"><thead><tr><th>날</th><th>만든 양</th><th>그날 값</th><th>바꾼 것</th><th>결과</th></tr></thead><tbody>${body}</tbody></table></div>`;
}
/* cfg: made, rate, need(행운의 덤만큼 늘어난 필요량), day(며칠째), hint, ledger(cur), onResult({n, after, ok}) → 말풍선 HTML
   ① 오늘 값 → ② 물고기를 직접 잡을 때와 시장에서 바꿀 때 포기하는 열매를 그림으로 견줌(결론은 학생이 내림) → ③ 바꿀 횟수와 계산표 */
function marketBoard(cfg) {
  return new Promise(resolve => {
    const [a, b] = cfg.rate, made = cfg.made, need = cfg.need || NEED;
    const fruitMax = Math.floor(made.fruit / b), fishMax = Math.floor(BEAR_FISH / a), max = Math.min(fruitMax, fishMax);
    const after = n => ({ fish: made.fish + a * n, fruit: made.fruit - b * n });
    const OC = HR.r.fish / HR.r.fruit;   // 토끼 마을 물고기 1마리의 기회비용 (열매)
    const st = { n: 0, said: '', res: null };
    const sh = openModal(false);
    const ics = (k, n, cls = '') => `<span class="mk-ics ${cls}">${IC[k].repeat(n)}</span>`;
    const head = (no, t) => `<h3><span class="mk-n">${no}</span>${t}</h3>`;
    const verdict = (k, have) => { const d = have - need[k]; return d < 0 ? `<td class="mk-bad">✖ ${-d}${GD[k].u} 모자라요</td>` : `<td class="mk-good">✔ ${d ? `${d}${GD[k].u} 남아요` : '딱 맞아요'}</td>`; };
    const render = () => {
      const n = st.res ? st.res.n : st.n, af = after(n), p = new F(b, a);
      const stop = st.res ? '' : !max ? `<div class="trade-row res-no">열매가 ${made.fruit}개뿐이라 한 번도 바꿀 수 없어요.</div>`
        : st.n >= max ? `<p class="note mk-stop">${fruitMax <= fishMax ? `남은 열매 ${af.fruit}개로는 더 바꿀 수 없어요(한 번에 ${b}개).` : `곰 마을 물고기는 오늘 ${BEAR_FISH}마리까지라 더 바꿀 수 없어요.`}</p>` : '';
      const step1 = `<div class="mk-step">${head(1, '오늘 시장 값')}
        <div class="rate"><b>${rateTxt(cfg.rate)}</b><span class="note">열매 ${b}개를 내면 물고기 ${a}마리를 받아요. 곰 마을 물고기는 오늘 ${BEAR_FISH}마리까지 있어요.</span></div></div>`;
      const step2 = `<div class="mk-step">${head(2, `물고기 ${a}마리, 어떻게 얻을까?`)}
        <div class="cmp mk-cmp">
          <div class="mk-opt"><div class="mk-opt-h">🎣 직접 잡기 <small class="nw">${a * HR.r.fish}시간</small></div>${ics('fruit', a * OC, 'faded')}<div>그 시간에 딸 수 있던<br><b class="nw">열매 ${a * OC}개</b>를 포기</div></div>
          <div class="mk-opt"><div class="mk-opt-h">🏪 시장에서 바꾸기</div>${ics('fruit', b)}<div>곰 마을에<br><b class="nw">열매 ${b}개</b>를 내요</div></div>
        </div>
        <p class="note">물고기 1마리로 치면 직접 잡기는 열매 ${OC}개 포기, 시장은 <span class="nw">열매 ${p.html()}개</span>. 어느 쪽이 열매를 덜 쓸까요?</p></div>`;
      const step3 = `<div class="mk-step">${head(3, st.res ? '바꾼 결과' : '몇 번 바꿀까?')}
        ${st.res ? '' : `<div class="trade-row mk-plan">🤝 <span class="step"><button type="button" id="n-" aria-label="바꿀 횟수 줄이기" ${st.n <= 0 ? 'disabled' : ''}>−</button><output>${st.n}</output><button type="button" id="n+" aria-label="바꿀 횟수 늘리기" ${st.n >= max ? 'disabled' : ''}>+</button></span>번 바꾸기
          <span class="note nw">한 번에 ${IC.fruit}${b} → ${IC.fish}${a}</span></div>${stop}`}
        <div class="tw"><table class="mk-tbl"><thead><tr><th></th><th>${IC.fish} 물고기</th><th>${IC.fruit} 열매</th></tr></thead><tbody>
          <tr><th>🎒 가져온 것</th><td>${made.fish}</td><td>${made.fruit}</td></tr>
          <tr><th>🤝 바꾸기 <span class="nw">${n}번</span></th><td>${n ? `+${a * n}` : '0'}</td><td>${n ? `−${b * n}` : '0'}</td></tr>
          <tr class="mk-sum" id="mk-after"><th>바꾼 뒤</th><td>${af.fish}</td><td>${af.fruit}</td></tr>
          <tr id="mk-need"><th>잔치에 필요</th><td>${need.fish}</td><td>${need.fruit}</td></tr>
          <tr class="mk-res"><th>결과</th>${verdict('fish', af.fish)}${verdict('fruit', af.fruit)}</tr>
        </tbody></table></div>
        ${hasLuck(made) ? `<p class="note mk-luck">🎊 행운 소문에 잔치 손님이 늘어 필요한 양이 늘었어요(처음 주문: <span class="nw">물고기 ${NEED.fish}마리</span> · <span class="nw">열매 ${NEED.fruit}개</span>).</p>` : ''}</div>`;
      const hint = cfg.hint && !(st.res && st.res.ok);
      const btns = `<div class="mk-btns">${!st.res ? '<button type="button" class="btn wide" id="mk-go">🤝 이대로 바꾸고 잔치 준비 마치기</button>'
          : `<button type="button" class="btn wide" id="mk-next">${st.res.ok ? '다음 ▶' : '☀️ 다음 날 다시 일하기'}</button>`}
        ${hint ? '<button type="button" class="btn ghost small" id="mk-hint">💬 동료에게 묻기</button>' : ''}
        <button type="button" class="btn ghost small${hint ? '' : ' wide'}" id="mk-note">📒 수첩</button></div>`;
      sh.innerHTML = `<h2>🏪 교역섬 시장${cfg.day ? ` <span class="note nw">${cfg.day}일째 저녁</span>` : ''}</h2>
        <p class="sub">오늘 만든 것을 곰 마을 물고기와 바꿔 잔치 준비를 마쳐요.</p>
        <div class="mk-grid"><div>${step1}${step2}</div><div>${step3}${st.said}${btns}</div></div>
        ${cfg.ledger(st.res ? 'last' : null)}`;
      const step = (id, d) => { const el = sh.querySelector(id); if (el) el.onclick = () => { sfx('sel'); st.n = clamp(st.n + d, 0, max); render(); const nb = sh.querySelector(id); if (nb && !nb.disabled) nb.focus(); }; };
      step('#n-', -1); step('#n\\+', 1);
      const go = sh.querySelector('#mk-go');
      if (go) go.onclick = () => {
        const af2 = after(st.n), ok = af2.fish >= need.fish && af2.fruit >= need.fruit;
        st.res = { n: st.n, after: af2, ok };
        st.said = cfg.onResult(st.res);
        sfx(ok ? 'win' : 'no'); render(); scrollSay(sh);
      };
      const hb = sh.querySelector('#mk-hint'); if (hb) hb.onclick = () => { sfx('sel'); st.said = (st.res ? st.said.split('<div class="say hint')[0] : '') + openHint(cfg.hint); render(); scrollSay(sh); };
      sh.querySelector('#mk-note').onclick = () => { sfx('sel'); openNotebook(); };
      const nx = sh.querySelector('#mk-next'); if (nx) { nx.onclick = () => { sfx('sel'); closeModal(); resolve(st.res); }; setTimeout(() => nx.focus(), 50); }
    };
    render();
  });
}

/* =========================================================
   시장 운영 이레 (선택 활동): 날마다 아침에 토끼 마을 지도에서 12시간 일하고(workDay),
   저녁에 시장판에서 그날 값으로 바꾼 뒤(폭풍 날은 시장이 닫힘) 물고기 3·열매 5를 먹는다. 남은 것은 창고로.
   ========================================================= */
const MARKET_STORMS = [[3, 5], [3, 6], [3, 7], [4, 6], [4, 7], [5, 7]];
/* 물고기 품귀 날 값(곰 마을 물고기가 귀한 날): 물고기 1마리 = 열매 8개. 토끼 마을이 직접 잡을 때 포기하는 열매 6개보다 비싸서(교환 비율이 두 마을 기회비용 범위 밖),
   그날은 사지 않고 직접 잡거나 미리 사 둔 것으로 버티는 쪽이 낫다. 이레 중 하루, 첫날·폭풍 날이 아닌 날에 온다 */
const SCARCE_RATE = [1, 8];
const hungerOf = log => log.filter(d => d.hungry).length;
/* 창고 s로 그날을 굶지 않고 넘겼을 때 가능한 다음 창고들 */
function weekNext(s, rate, storm) {
  const out = new Map();
  for (let f = 0; f * HR.r.fish <= DAY_H; f++) {
    const fish = s.fish + f, fruit = s.fruit + (DAY_H - f * HR.r.fish) / HR.r.fruit;
    for (let n = 0; n <= (storm ? 0 : Math.floor(BEAR_FISH / rate[0])); n++) {
      const F2 = fish + (storm ? 0 : rate[0] * n), R2 = fruit - (storm ? 0 : rate[1] * n);
      if (R2 < 0) break;
      if (F2 >= NEED.fish && R2 >= NEED.fruit) out.set(`${F2},${R2}`, { fish: F2 - NEED.fish, fruit: R2 - NEED.fruit });
    }
  }
  return [...out.values()];
}
const canWeather = s => weekNext(s, null, true).length > 0;
function weekSolvable(rates, storms) {
  let cur = [{ fish: 0, fruit: 0 }];
  for (let d = 0; d < rates.length && cur.length; d++) {
    const m = new Map();
    cur.forEach(s => weekNext(s, rates[d], storms.includes(d + 1)).forEach(n => m.set(`${n.fish},${n.fruit}`, n)));
    cur = [...m.values()];
  }
  return cur.length > 0;
}
/* 폭풍 날과 날마다의 값을 무작위로 정하되, 아무도 굶지 않는 길이 있는 주만 낸다 */
function makeWeek() {
  if (G.forceWeek) return G.forceWeek;
  for (let i = 0; i < 300; i++) {
    const storms = rnd(MARKET_STORMS), scarce = rnd([2, 3, 4, 5, 6, 7].filter(d => !storms.includes(d)));
    const rates = Array.from({ length: 7 }, (_, k) => k + 1 === scarce ? SCARCE_RATE : rnd(RATES));
    if (weekSolvable(rates, storms)) return { storms, rates, scarce };
  }
  return { storms: [3, 6], scarce: 5, rates: [[1, 1], [1, 2], [1, 1], [1, 1], SCARCE_RATE, [1, 1], [1, 1]] };
}
function weekLedger(log) {
  if (!log.length) return '<p class="note">아직 보낸 날이 없어요.</p>';
  return `<div class="tw"><table class="ledger"><thead><tr><th>날</th><th>날씨 · 값</th><th>만든 양</th><th>바꾼 것</th><th>먹고 난 뒤</th></tr></thead><tbody>${log.map((d, i) => { const [a, b] = d.rate;
    return `<tr class="${i === log.length - 1 ? 'new' : ''}"><td>${d.day}</td><td>${d.storm ? '⛈️ 휴장' : `<span class="nw">${d.scarce ? '💸' : '☀️'} ${a}:${b}</span>`}</td><td>${stockTxt(d.made)}</td><td>${d.n ? `<span class="nw">${IC.fruit}${b * d.n}→${IC.fish}${a * d.n}</span>` : '—'}</td><td>${d.hungry ? `😢 ${shortIcon(d.af, NEED)}` : `😊 ${stockTxt(d.end)}`}</td></tr>`; }).join('')}</tbody></table></div>`;
}
/* 이레 치 날씨와 값 예보. d일째를 '오늘'로 표시 */
function weekForecast(cfg, d) {
  return `<div class="wx" aria-label="날씨와 시장 값 예보">${cfg.rates.map((r, i) => `<span class="${i + 1 < d ? 'past' : i + 1 === d ? 'now' : ''}${cfg.scarce === i + 1 ? ' scarce' : ''}"><small>${i + 1}일</small>${cfg.storms.includes(i + 1) ? '⛈️' : cfg.scarce === i + 1 ? '💸' : '☀️'}<small>${cfg.storms.includes(i + 1) ? '휴장' : `${r[0]}:${r[1]}`}</small></span>`).join('')}</div>
    ${cfg.scarce ? '<p class="note wx-key">💸 물고기 품귀: 곰 마을 물고기가 귀해 값이 비싼 날</p>' : ''}`;
}
/* cfg: storms, rates(날마다), hints. 끝나면 { store, log } */
async function weekQuest(cfg) {
  const days = cfg.rates.length, st = { store: { fish: 0, fruit: 0 }, log: [], hint: 0 };
  for (let d = 1; d <= days; d++) {
    const stormy = cfg.storms.includes(d), rate = cfg.rates[d - 1], next = d < days && cfg.storms.includes(d + 1), scarce = cfg.scarce === d, nextScarce = cfg.scarce === d + 1;
    await fadeTo(() => warp(13, 29, 'up'));
    toast(`${stormy ? '⛈️' : '☀️'} ${d}일째 아침 · 토끼 마을`, 'gold', 2400);
    showCard(`<h3>📦 시장 운영 <span class="nw">${d}/${days}일째 아침</span></h3>${weekForecast(cfg, d)}
      <p class="note center">예보의 값은 물고기:열매 · 날마다 먹는 양 <span class="nw">${IC.fish}${NEED.fish} ${IC.fruit}${NEED.fruit}</span></p>
      <div class="out"><b>📦 창고</b><span>${stockTxt(st.store)}</span></div>`);
    await say('tori', (stormy ? '오늘은 폭풍이라 저녁에 시장이 닫혀. 창고와 오늘 만든 것으로 버텨야 해.' : `${scarce ? '오늘은 물고기 품귀래. 곰 마을 물고기가 귀하대. ' : ''}오늘 시장 값은 ${amt('fish', rate[0])} = ${amt('fruit', rate[1])}야.`)
      + (next ? ' 내일은 폭풍이야! 오늘 미리 대비하자.' : nextScarce ? ' 내일은 물고기 품귀래.' : '')
      + (d === 1 ? ' 과수원은 서쪽, 낚시터는 남쪽 부두야.' : d === 2 ? ' 그리고 손에 익었으니 오늘부터 열매는 Ⓐ 한 번에 2개씩 딸 수 있어.' : ''));
    const made = await workDay({ cost: HR.r, hours: DAY_H, day: d,
      info: `<span class="nw">📦창고 ${IC.fish}${st.store.fish} ${IC.fruit}${st.store.fruit}</span><span class="nw">${stormy ? '⛈️ 오늘 휴장' : `${scarce ? '💸 오늘 품귀' : '☀️ 오늘'} ${IC.fish}${rate[0]}=${IC.fruit}${rate[1]}`}${next ? ' · 내일 ⛈️' : nextScarce ? ' · 내일 💸' : ''}</span>` });
    if (!stormy) await fadeTo(() => warp(28, 19, 'up'));
    await weekEvening(cfg, st, d, made);
  }
  return st;
}
/* 저녁 시장판: 창고와 그날 만든 것으로 바꾸고(폭풍 날은 시장이 닫힘) 먹는다. st.store·st.log를 바꾼다 */
function weekEvening(cfg, st, d, made) {

    const have = { fish: st.store.fish + made.fish, fruit: st.store.fruit + made.fruit };

    const v = { n: 0, said: '', done: false, store0: st.store };
    const sh = openModal(false);
    const calc = () => {
      const af = stormy ? have : { fish: have.fish + rate[0] * v.n, fruit: have.fruit - rate[1] * v.n };
      const end = { fish: Math.max(0, af.fish - NEED.fish), fruit: Math.max(0, af.fruit - NEED.fruit) };

      // 물고기 품귀 날: 사서 더 쓴 열매(직접 잡을 때 포기하는 열매와 견줌), 또는 사지 않고 직접 잡았음

      else if (scarce && made.fish) L.push('🎣 물고기 품귀 날 시장에서 사지 않고 직접 잡았어요.');
      L.push(o.hungry ? `😢 ${shortTxt(o.af, NEED)}가 모자라 배를 곯았어요.` : o.end.fish + o.end.fruit ? `😊 배불리 먹었어요. 창고에 남은 것 ${stockTxt(o.end)}` : '🙂 딱 맞게 먹었어요. 창고에 남은 것은 없어요.');

    const OC = HR.r.fish / HR.r.fruit;   // 토끼 마을 물고기 1마리의 기회비용 (열매)
    const head = (no, t) => `<h3><span class="mk-n">${no}</span>${t}</h3>`;
    /* ① 오늘 값(폭풍이면 휴장) ② 앞으로의 날씨와 값(내일 폭풍이면 대비 확인) ③ 바꿀 횟수와 계산표(창고 → 먹기 → 내일 창고) */
    const render = () => {
      const o = calc(), [a, b] = rate, next = d < days ? { storm: cfg.storms.includes(d + 1), rate: cfg.rates[d] } : null;
      const cell = (k, x, sign = '') => `<td>${x ? `${sign}${x}` : '0'}</td>`;
      const verdict = k => { const dd = o.af[k] - NEED[k]; return dd < 0 ? `<td class="mk-bad">✖ ${-dd}${GD[k].u} 모자라요</td>` : `<td class="mk-good">✔ ${dd ? `${dd}${GD[k].u} 남아요` : '딱 맞아요'}</td>`; };
      const step1 = `<div class="mk-step">${head(1, stormy ? '오늘은 폭풍' : scarce ? '오늘 시장 값 · 💸 물고기 품귀' : '오늘 시장 값')}
        ${scarce ? '<div class="prep dear">💸 <b>물고기 품귀!</b> 곰 마을 물고기가 귀해 오늘 값이 비싸요.</div>' : ''}
        ${stormy ? '<div class="trade storm"><div class="trade-row">⛈️ 폭풍이라 시장이 닫혔어요. 창고와 오늘 만든 것으로만 버텨야 해요.</div></div>'
          : `<div class="rate"><b>${rateTxt(rate)}</b><span class="note">열매 ${b}개를 내면 물고기 ${a}마리를 받아요. 곰 마을 물고기는 오늘 ${BEAR_FISH}마리까지 있어요.</span></div>
          <p class="note">물고기 1마리로 치면 직접 잡기는 열매 ${OC}개 포기, 오늘 시장은 <span class="nw">열매 ${new F(b, a).html()}개</span>예요.</p>`}</div>`;
      const step2 = `<div class="mk-step">${head(2, '앞으로의 날씨와 값')}${weekForecast(cfg, d)}
        ${!next ? '<p class="note">오늘이 마지막 날이에요.</p>'
          : next.storm ? `<div class="prep">⛈️ <b>내일은 폭풍!</b> 시장이 닫혀요. 이대로면 내일 버틸 수 있을까? ${canWeather(o.end) ? '<span class="res-ok">버틸 수 있어요</span>' : '<span class="res-no">모자라요</span>'}</div>`
          : `<p class="note">${cfg.scarce === d + 1 ? '💸 내일은 물고기 품귀예요. ' : ''}내일 시장 값은 <span class="nw">${rateTxt(next.rate)}</span>예요. 오늘 값과 견줘 보세요.</p>`}</div>`;

        <div class="tw"><table class="mk-tbl"><thead><tr><th></th><th>${IC.fish} 물고기</th><th>${IC.fruit} 열매</th></tr></thead><tbody>
          <tr><th>📦 창고</th>${cell('fish', v.store0.fish)}${cell('fruit', v.store0.fruit)}</tr>
          <tr><th>🎒 오늘 만든 것</th>${cell('fish', made.fish, '+')}${cell('fruit', made.fruit, '+')}</tr>
          ${stormy ? '' : `<tr><th>🤝 바꾸기 <span class="nw">${o.n}번</span></th>${cell('fish', a * o.n, '+')}${cell('fruit', b * o.n, '−')}</tr>`}
          <tr class="mk-sum" id="wk-before"><th>먹기 전</th><td>${o.af.fish}</td><td>${o.af.fruit}</td></tr>
          <tr><th>🍽️ 오늘 먹을 양</th><td>−${NEED.fish}</td><td>−${NEED.fruit}</td></tr>
          <tr class="mk-res"><th>먹고 나면</th>${verdict('fish')}${verdict('fruit')}</tr>
          <tr class="mk-sum" id="wk-end"><th>📦 내일 창고</th><td>${o.end.fish}</td><td>${o.end.fruit}</td></tr>
        </tbody></table></div>${o.hungry && !v.done ? '<p class="note mk-stop">이대로면 오늘 배를 곯아요.</p>' : ''}</div>`;
      const btns = `<div class="mk-btns">${v.done ? `<button type="button" class="btn wide" id="db-next">${d >= days ? '다음 ▶' : '🌙 자러 가기 · 다음 날 ▶'}</button>`
          : `<button type="button" class="btn wide" id="db-go">${stormy ? '⛈️' : '🍽️'} 이대로 먹고 하루 마치기</button>`}
        ${cfg.hints && !v.done ? '<button type="button" class="btn ghost small" id="db-hint">💬 동료에게 묻기</button>' : ''}
        <button type="button" class="btn ghost small${cfg.hints && !v.done ? '' : ' wide'}" id="db-note">📒 수첩</button></div>`;
      sh.innerHTML = `<h2>🌙 ${d}일째 저녁 · ${stormy ? '⛈️ 폭풍' : '교역섬 시장'} <span class="nw note">${d}/${days}</span></h2>
        <div class="goalbar">날마다 먹는 양 <span class="nw">${IC.fish}${NEED.fish} ${IC.fruit}${NEED.fruit}</span> · <span class="nw">굶은 날 ${hungerOf(st.log)}번</span><br><span class="note">먹고 남은 것은 창고에 쌓여 다음 날 쓸 수 있어요.</span></div>

function zonesHTML(i, v, nf) {

  return `<div class="zones mv3"><div class="zone fish"><div class="zone-h">🎣 낚시터 ${nf}명</div><div class="workers">${Array.from({ length: nf }, () => tok(true)).join('')}</div></div>
    <div class="mover"><button type="button" class="mv" data-v="${i}" data-d="1" ${nf >= v.workers ? 'disabled' : ''} aria-label="과수원 일꾼 한 명을 낚시터로">◀</button><small>한 명씩</small><button type="button" class="mv" data-v="${i}" data-d="-1" ${nf <= 0 ? 'disabled' : ''} aria-label="낚시터 일꾼 한 명을 과수원으로">▶</button></div>
    <div class="zone fruit"><div class="zone-h">🌳 과수원 ${v.workers - nf}명</div><div class="workers">${Array.from({ length: v.workers - nf }, () => tok(false)).join('')}</div></div></div>`;
}
function bindMove(sh, nf, max, render) {
  const move = (i, d) => {
    const n = clamp(nf[i] + d, 0, max(i)); if (n === nf[i]) return false;
    sfx('sel'); nf[i] = n; render(); sh.querySelectorAll(`.wk[data-v="${i}"]`).forEach(t => t.classList.add('moved')); return true;
  };
  sh.querySelectorAll('.wk').forEach(b => b.onclick = () => move(+b.dataset.v, +b.dataset.d));
  sh.querySelectorAll('.mv').forEach(b => b.onclick = () => {
    const v = b.dataset.v, d = b.dataset.d; move(+v, +d);
    const nb = sh.querySelector(`.mv[data-v="${v}"][data-d="${d}"]`); if (nb && !nb.disabled) nb.focus();
  });
}

/* --- 선택 활동: 교역섬 시장 운영 (이레, 폭풍 두 번, 날마다 다른 값) --- */
async function marketQuest() {
  if (!S.f.marketMet) {
    await say('peng2', '교역관님! 폭풍 소식 기억나요? 이번에는 토끼 마을 살림을 이레 동안 맡아 주세요.');
    await say('peng2', `날마다 토끼 마을에서 ${DAY_H}시간 일하고, 시장에서 바꾸고, ${amt('fish', NEED.fish)}와 ${amt('fruit', NEED.fruit)}를 먹어요. 남은 것은 창고에 쌓여요.`);
    await say('peng2', '이번엔 이레 치 날씨와 시장 값 예보가 있어요. 폭풍은 두 번 오고, 폭풍 날엔 시장이 닫혀요. 물고기가 귀해 값이 비싼 품귀 날(💸)도 하루 있어요.');
    await say('peng2', '목표는 이레 동안 한 번도 굶지 않기예요! 이레가 끝났을 때 창고가 넉넉할수록 더 잘한 거예요.');
    S.f.marketMet = true;
  } else if (await ask('peng2', S.f.marketDone ? '한 번 더 해 볼래요? 날씨와 값은 새로 정해져요.' : '시장 운영을 다시 해 볼래요?', ['좋아요', '다음에요'])) return;
  await say('peng2', '창고는 비어 있어요. 아침마다 토끼 마을에서 일하고, 저녁에 여기 시장으로 와요. 첫날부터 시작해 볼까요?');
  Dlg.close();
  const wk = makeWeek();
  const st = await weekQuest({ storms: wk.storms, rates: wk.rates, scarce: wk.scarce, hints: MARKET_HINTS });
  await fadeTo(() => warp(24, 19, 'up'));
  const h = hungerOf(st.log), OC = HR.r.fish / HR.r.fruit;
  // 남은 창고를 열매로 쳐서 견준다: 물고기 1마리 = 열매 6개(토끼 마을이 직접 잡을 때 포기하는 열매)
  const val = x => x.fruit + x.fish * OC, rec = { h, fish: st.store.fish, fruit: st.store.fruit }, prev = S.market && S.market.bestStore;
  const better = !prev || h < prev.h || (h === prev.h && val(rec) > val(prev));
  const waste = st.log.filter(x => x.scarce && x.n).reduce((t, x) => t + x.rate[1] * x.n - x.rate[0] * x.n * OC, 0);
  S.store = st.store; S.market = { best: Math.min(S.market ? S.market.best : h, h), tries: (S.market ? S.market.tries : 0) + 1, bestStore: better ? rec : prev };
  const first = !S.f.marketDone; S.f.marketDone = true; save();
  if (first) toast('✅ 선택 활동 완료: 교역섬 시장 운영', 'gold', 3200);
  if (!h) { sfx('win'); await say('peng2', '이레 동안 한 번도 굶지 않았어요! 폭풍도 거뜬히 넘겼네요.'); }
  else await say('peng2', `이레 동안 굶은 날이 ${h}번 있었어요. 값이 쌀 때 물고기를 사 두면 달라질 거예요. 다시 말을 걸면 새 예보로 해 볼 수 있어요.`);
  await say('peng2', `남은 창고는 ${stockTxt(st.store)}예요. 물고기 1마리를 열매 ${OC}개로 치면 <b>열매 ${val(rec)}개</b>만큼 남았어요.${prev ? (better ? ' 지난 기록보다 넉넉해요!' : ` 지난 가장 좋은 기록은 굶은 날 ${prev.h}번, 열매 ${val(prev)}개만큼이었어요.`) : ''}`);
  if (waste) await say('peng2', `💸 물고기 품귀 날 물고기를 사느라 직접 잡을 때보다 열매 ${waste}개를 더 썼어요.`);
  await say('sage', '값이 쌀 때 넉넉히 사 두고 폭풍 전에 창고를 채우는 것. 교역의 이익을 지키면서 위험에 대비하는 방법이란다.');
  await say('sage', `그리고 품귀 날처럼 물고기 1마리 값이 직접 잡을 때 포기하는 열매(${OC}개)보다 비싸면, 바꾸지 않는 게 낫단다. 교환 비율이 두 마을의 기회비용 사이에 있어야 교역이 서로에게 이득이지.`);

function hintLines() {
  if (UNIT === 'choice') return cHintLines();
  if (UNIT === 'finance') return fHintLines();
  const p = S.party, who = p.includes('fox') ? 'fox' : p.includes('gomi') ? 'gomi' : p.includes('tori') ? 'tori' : 'yd', f = S.f, L = [];
  switch (S.ch) {
    case 0: L.push([who, '거북 박사님께 말을 걸어 보자.']); break;
    case 1: L.push([who, '광장 옆 빨간 지붕 집이 촌장님 댁이야. 화면 가장자리의 노란 화살표를 따라가 보자.']); break;
    case 2: L.push(f.bearArrived ? ['tori', '곰 마을 촌장님 댁은 곰섬 광장 북쪽에 있대.'] : ['tori', '모래밭이나 부두에서 바다 쪽으로 걸어가면 배를 타. 동쪽으로 쭉 가면 곰섬이야!']); break;
    case 3: L.push(!f.c3done ? ['gomi', '교역섬은 두 섬 사이 북쪽의 작은 섬이야. 배에서 Ⓐ를 누르면 가 본 섬으로 바로 갈 수도 있어.'] : ['tori', '잔치는 우리 마을 광장에서 해! 할아버지께 가 보자.']); break;
    default:
      if (!f.marketDone) L.push(['gomi', '교역섬 시장의 펭귄 상인이 이레 동안 토끼 마을 살림을 맡아 달래. 이번엔 날씨와 값 예보도 있대!']);
      else if (!f.c5done) L.push(['gomi', '북서쪽 여우섬의 여울이 하루 일해 줄 교역관을 찾는대.']);
      else if (!f.c6done) L.push(['fox', '북쪽 박람회섬의 사자 심사관한테 가 보자. 표를 보면 먼저 무슨 표인지부터 확인해!']);
      else if (!f.twinsDone) L.push(['tori', '북동쪽 쌍둥이섬의 닭 촌장님이 교역관을 찾는대.']);
      else L.push([who, S.memos.length < 3 ? '작은 섬 어딘가에 박사님 메모가 든 상자가 있대. 모래밭이 있는 작은 섬들을 살펴보자.' : '선택 활동을 다 했어! 수첩을 다시 읽어 보자.']);
  }
  if (S.ch >= 2 && S.memos.length < 3 && S.ch < 4) L.push(['tori', '작은 섬에 반짝이는 상자가 있을지도 몰라. 박사님 메모가 들어 있대. 본편을 마친 뒤에 찾아봐도 돼.']);
  return L.map(([w, t]) => [S.party.includes(w) || w === 'yd' ? w : who, t]);
}

function cCalc(alts) {

  for (const k in alts) {

}

function cTbl(cols, opts = {}) {

function doJob(cfg) {
  return new Promise(resolve => {
    const saved = G.busy; G.busy = 0; Dlg.close(); hideCard();
    G.job = { ...cfg, k: 0, msg: cfg.msg || '', finish: () => { AH.block = AH.on; AH.on = false; G.job = null; jobBar(); G.busy = saved; updateHUD(); resolve(); } };
    jobBar(); updateHUD();
  });
}
function jobBar() {
  let b = $('jobbar');
  if (!G.job) { if (b) b.remove(); if (!G.work) $('toasts').style.top = ''; return; }
  if (!b) { b = document.createElement('div'); b.id = 'jobbar'; b.className = 'workbar'; $('stage').appendChild(b); }
  const j = G.job;
  b.innerHTML = `<span class="nw">${j.title} <b class="jb-k">${j.k}/${j.n}</b></span><span class="nw">🐚 ${S.shell}</span>${j.msg ? `<span class="wb-msg" aria-live="polite">${j.msg}</span>` : ''}`;
  $('toasts').style.top = `${b.offsetTop + b.offsetHeight + 6}px`;
}
function jobSay(msg, snd) { if (!G.job) return; G.job.msg = msg; if (snd) sfx(snd); jobBar(); }
const jobHit = (j, tx, ty) => { const o = objAt(tx, ty), n = npcAt(tx, ty); return !!((o && j.at.includes(o.id)) || (n && j.at.includes(n.id))); };
/* 일하는 동안의 Ⓐ. 정한 곳이면 한 번 하고 true. hold: 길게 누르기로 불렸을 때(엉뚱한 곳이면 조용히 멈춘다) */
function jobAct(tx, ty, hold) {
  const j = G.job; if (!j || j.k >= j.n) return false;
  if (jobHit(j, tx, ty)) {
    j.k++; const r = j.each(j.k);
    if (r.shell) { S.shell += r.shell; updateHUD(); }
    jobSay(`${r.msg}${r.shell ? ` <b class="nw">🐚 +${r.shell}</b>` : ''}`, r.shell ? 'coin' : 'ok');
    AH.next = Math.max(AH.next, performance.now() + HOLD_EVERY);
    if (j.k >= j.n) setTimeout(() => { if (G.job === j) j.finish(); }, 500);
    return true;
  }
  if (!hold) jobSay(npcAt(tx, ty) || followerAt(tx, ty) ? '일을 마치고 이야기하자!' : j.where, 'no');
  return false;
}
/* 화면을 눌러 일하기: 일할 곳을 누르면 그 옆으로 걸어가서 한다 */
function jobTap(tx, ty) {
  if (!jobHit(G.job, tx, ty)) return false;
  const near = (x, y) => Math.abs(x - tx) + Math.abs(y - ty) === 1;
  if (near(P.x, P.y)) { P.dir = dirTo(P, { x: tx, y: ty }); interact(); aDown(G.tapPtr); return true; }
  const path = findPath((x, y) => near(x, y) && walkable(x, y, 'land'), 'land');
  if (path) { P.path = path; P.after = () => { P.dir = dirTo(P, { x: tx, y: ty }); interact(); }; aDown(G.tapPtr); }
  return true;
}

/* ---------- 시험지 연습 ---------- */
const num = n => n.toLocaleString('ko-KR'), won = n => `${num(n)}원`;
const sgnNum = n => `${n > 0 ? '+' : n < 0 ? '−' : ''}${num(Math.abs(n))}`;
const UNIT_WON = '<p class="note c-unit">(단위: 원)</p>';   // 표 칸에는 숫자만 적는다(교재 86쪽 서술형 01처럼). 좁은 화면에서 표가 넘치지 않게
/* 시험지 한 장: T 표형(두 대안의 편익·비용 → 진술 하나), S 매몰 비용 사례형. 숫자는 매번 새로 만들고, 순편익이 양인 대안이 정확히 하나 */
function cGenExam(type) {
  if (type === 'T') {
    let A, B;
    do { A = { ben: ri(6, 19) * 5000, cost: ri(2, 16) * 5000 }; B = { ben: ri(6, 19) * 5000, cost: ri(2, 16) * 5000 }; }
    while (A.ben <= A.cost || B.ben <= B.cost || A.ben - A.cost === B.ben - B.cost);
    const R = cCalc({ A, B }), ctx = rnd([['공연 관람', '놀이공원 이용'], ['요리 강좌', '수영 강좌'], ['○○ 브랜드 운동화', '△△ 브랜드 운동화']]);
    const X = rnd(['A', 'B']), Y = X === 'A' ? 'B' : 'A', t = Math.random() < .5;
    const q = rnd([
      () => ({ st: `${X}를 선택할 경우 기회비용은 ${won(t ? R[X].oc : rnd([R[X].cost, R[X].cost + R[Y].ben]))}이다.`, tr: t }),
      () => ({ st: `${X} 선택에 따른 순편익은 양(+)의 값을 갖는다.`, tr: R[X].net > 0 }),
      () => ({ st: `${X}를 선택할 경우 암묵적 비용은 ${won(t ? R[X].imp : R[Y].ben)}이다.`, tr: t }),
      () => ({ st: `${Y}보다 ${X}를 선택하는 것이 합리적이다.`, tr: R[X].net > 0 })
    ])();
    const stem = `<p>갑은 같은 시간에 할 수 있는 ${ctx[0]}(A)와 ${ctx[1]}(B) 가운데 하나만 선택할 수 있다. 표는 각 대안을 선택할 때 얻는 편익과 실제로 내야 하는 비용이다.</p>
